<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мырыш + тұз қышқылы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm school lab workbook, clear and encouraging (grade 7)
   IDEA: a workbench sheet — the activity series above a single test tube with a zinc granule
   PICTURE: hydrogen bubbles streaming off the zinc granule as it slowly shrinks in dilute acid
   COLOUR and TYPE: white sheet on deep lab-teal; the indicator colours themselves; Noto Serif + Noto Sans
   LAYOUT: steps left, scene right (sticky) with view switch; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#0f4c5c,#0a2d36);--sheet:light-dark(#ffffff,#13202a);--ink:light-dark(#10131a,#e7edf2);
--mute:light-dark(#566170,#9fb0bf);--line:light-dark(#d5dde5,#2b3d4b);--soft:light-dark(#eef5f7,#182a35);
--acc:light-dark(#0f4c5c,#5cc2d6);--ok:light-dark(#12733a,#4ade80);--bad:light-dark(#b91c1c,#f87171);
--warn:light-dark(#fff4d6,#3a2f12);--glass:light-dark(#f7fbfd,#1d2f3b);--glassline:light-dark(#8aa1b1,#6c8597)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(3vw,12px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:18px}
header small{display:block;opacity:.8;font-size:14px}
h1{font:700 clamp(24px,3.6vw,38px)/1.08 "Noto Serif",Georgia,serif;margin:2px 0 0;text-wrap:balance;max-width:26ch}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#fff;font:600 15px "Noto Sans",Arial,sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button.on{background:#fff;color:#0f4c5c}
.sheet{background:var(--sheet);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:clamp(16px,2.6vw,30px)}
.note{font-size:13px;color:var(--mute);margin:0 0 10px}
.goal{margin:0 0 6px;max-width:70ch}
.reag{margin:0 0 16px;color:var(--mute);font-size:15px;max-width:70ch}
.safety{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.safety p{margin:0;flex:1 1 260px;font-weight:600}
.safety label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,36px);align-items:start}
.step{border-top:1px solid var(--line);padding:14px 0}
.step:first-child{border-top:0;padding-top:0}
.step.off{opacity:.45;pointer-events:none}
h2{font:700 19px/1.2 "Noto Serif",Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
textarea,select{font:16px "Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
textarea{min-height:76px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}
@keyframes glow{50%{fill:#f97316}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
@media(prefers-reduced-motion:reduce){.mag{transition:none}.glow,.flame{animation:none}}
.scroll{overflow-x:auto}
.fill{transition:fill .9s ease}.zn{transition:transform 20s linear;transform-box:fill-box;transform-origin:center}
.bub{animation:rise var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.95}100%{transform:translateY(-110px);opacity:0}}
.series{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}.series span{font:700 14px "Noto Sans",Arial,sans-serif;padding:4px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.series span.h{background:#fde68a;color:#10131a;border-color:#f59e0b}.series span.m{outline:2px solid var(--acc)}.res{transition:opacity 2.5s ease}.drop{transition:r 2.5s ease,opacity 2.5s ease}
.falling{animation:fall .5s ease-in}@keyframes fall{from{transform:translateY(-30px);opacity:1}to{transform:translateY(40px);opacity:0}}.tb{cursor:pointer}.tb:hover .gl{stroke:var(--acc)}
.bub{animation:rise var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.95}100%{transform:translateY(-80px);opacity:0}}
.smoke{animation:smoke 2.6s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.6}100%{transform:translateY(-70px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.bub,.smoke{animation:none;opacity:.6}}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;font-size:14px;width:130px}
td select{padding:6px;font-size:13px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px "Noto Sans",Arial,sans-serif;margin-bottom:10px}
.eq select{width:auto;padding:6px 8px;font:600 15px "Noto Sans",Arial,sans-serif}
.q{margin-bottom:10px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.board{position:static;order:-1}}
@media(max-width:600px){table{min-width:0!important;table-layout:fixed}td select{width:100%;max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><small data-i="lab"></small><h1 data-i="title"></h1></div>
  <div class="lang" role="group" aria-label="Тіл"><button id="l-kk" class="on">Қазақша</button><button id="l-ru">Русский</button></div>
</header>
<div class="sheet">
  <p class="note" data-i="demo"></p>
  <p class="goal" data-i="goal"></p>
  <p class="reag" data-i="reag"></p>
  <div class="safety">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3 32 30H2Z" fill="#f59e0b"/><rect x="15.5" y="11" width="3" height="11" rx="1.5" fill="#fff"/><circle cx="17" cy="26" r="1.8" fill="#fff"/></svg>
    <p data-i="safe"></p>
    <label><input type="checkbox" id="goggles" style="width:22px;height:22px"><span data-i="safeok"></span></label>
  </div>
  <div class="grid">
    <div>
      <section class="step" id="st1"><h2 data-i="s1"></h2><p class="hint" data-i="s1h"></p>
        <div class="series" id="series"></div>
        <label><span data-i="qp"></span><select id="pred"></select></label>
        <div class="btns"><button class="btn" id="savep" data-i="save"></button></div>
        <div class="msg" id="m1" aria-live="polite"></div></section>
      <section class="step" id="st2"><h2 data-i="s2"></h2><p class="hint" data-i="s2h"></p>
        <div class="btns"><button class="btn" data-b="zn" data-i="bzn"></button><button class="btn" data-b="acid" data-i="bacid"></button></div>
        <div class="msg" id="m2" aria-live="polite"></div></section>
      <section class="step" id="st3"><h2 data-i="s3"></h2><p class="hint" data-i="s3h"></p>
        <table><tbody id="tbl"></tbody></table>
        <div class="eq" id="weq" style="margin-top:14px"></div>
        <div class="btns"><button class="btn" id="chk3" data-i="check"></button></div>
        <div class="msg" id="m3" aria-live="polite"></div></section>
      <section class="step" id="st4"><h2 data-i="s4"></h2>
        <div class="q"><label><span data-i="q1"></span><textarea id="a1"></textarea></label></div>
        <div class="q"><label><span data-i="q2"></span><textarea id="a2"></textarea></label></div>
        <div class="btns"><button class="btn" id="send" data-i="send"></button></div>
        <div class="msg" id="m4" aria-live="polite"></div></section>
    </div>
    <div class="board"><div class="rackbox"><svg id="scene" viewBox="0 0 560 420" aria-label="scene"></svg></div></div>
  </div>
</div>
</div>
<script>
{
const T={
kk:{lab:"7-сынып · 9-зертханалық жұмыс",title:"Мырыштың сұйылтылған тұз қышқылымен әрекеттесуі",demo:"Үлгі нұсқа: тіркелу және жұмысты мұғалімге жіберу толық сайтта қосылады.",
goal:"Мақсаты: металдардың белсенділік қатары бойынша мырыш пен тұз қышқылы арасындағы реакцияға болжам жасап, оны тәжірибе арқылы тексеру.",
reag:"Реактивтер: мырыш түйіршіктері, тұз қышқылының сұйылтылған ерітіндісі. Құрал-жабдықтар: сынауықтарға арналған тұрғы, сынауық.",
safe:"Қышқыл ерітінділерімен жұмыс жасау ережелерін сақта: қорғау көзілдірігін ки.",safeok:"Ережені оқыдым",
s1:"1-қадам. Болжам жаса",s1h:"Металдардың белсенділік қатарындағы орнына сәйкес мырыш пен тұз қышқылы арасында химиялық реакцияның жүруіне болжам жаса. Сутекке дейін тұрған металдар қышқылдан сутекті ығыстырады.",
qp:"Мырыш тұз қышқылымен әрекеттесе ме?",po:["— таңда —","Иә, мырыш сутекке дейін тұр, реакция жүреді","Жоқ, мырыш сутектен кейін тұр, реакция жүрмейді"],save:"Болжамды сақтау",saved:"Болжам сақталды. Енді тексеріп көр!",fill:"Болжамды таңда.",
s2:"2-қадам. Тәжірибе жаса",s2h:"Сынауыққа мырыштың бір түйірін салып, үстіне 2 мл сұйылтылған тұз қышқылының ерітіндісін қос.",bzn:"Мырыш түйірін салу",bacid:"2 мл HCl қосу",
react:"Мырыштың бетінен газ көпіршіктері бөліне бастады. Мырыш түйірі біртіндеп кішірейіп жатыр.",
s3:"3-қадам. Бақылауыңды жаз",s3h:"Байқаған құбылысты таңда және реакция теңдеуін сөзбен жаз.",
rows:["Мырышқа қышқыл қосқанда","Химиялық реакция белгісі","Болжамың"],
o:[["—","Мырыш бетінен газ көпіршіктері бөлінді","Ерітінді көгерді","Ақ тұнба түзілді","Өзгеріс жоқ"],["—","Газ бөлінуі","Тұнба түзілуі","Түстің өзгеруі"],["—","Расталды","Расталмады"]],
w:["мырыш","тұз қышқылы","мырыш хлориді","сутек","оттек","су"],

s4:"4-қадам. Түсіндір",q1:"Байқаған құбылысты түсіндір: неге мырыш тұз қышқылымен әрекеттесті?",q2:"Қорытынды",
send:"Мұғалімге жіберу",sent:"Үлгіде жіберу әлі жұмыс істемейді. Толық сайтта жұмыс мұғалімнің бетіне түседі.",empty:"Алдымен барлық сұраққа жауап бер."},
ru:{lab:"7 класс · Лабораторная работа №9",title:"Взаимодействие цинка с разбавленной соляной кислотой",demo:"Демо-версия: регистрация и отправка работы учителю появятся в полной версии сайта.",
goal:"Цель: по ряду активности металлов предсказать, будет ли цинк реагировать с соляной кислотой, и проверить это на опыте.",
reag:"Реактивы: гранулы цинка, разбавленный раствор соляной кислоты. Оборудование: штатив для пробирок, пробирка.",
safe:"Соблюдай правила работы с растворами кислот: надень защитные очки.",safeok:"Правила прочитаны",
s1:"Шаг 1. Сделай прогноз",s1h:"По положению цинка в ряду активности металлов предскажи, пойдёт ли реакция между цинком и соляной кислотой. Металлы, стоящие до водорода, вытесняют водород из кислот.",
qp:"Реагирует ли цинк с соляной кислотой?",po:["— выбери —","Да, цинк стоит до водорода, реакция идёт","Нет, цинк стоит после водорода, реакция не идёт"],save:"Сохранить прогноз",saved:"Прогноз сохранён. Теперь проверь!",fill:"Выбери прогноз.",
s2:"Шаг 2. Проведи опыт",s2h:"Положи в пробирку одну гранулу цинка и добавь 2 мл разбавленной соляной кислоты.",bzn:"Положить гранулу цинка",bacid:"Добавить 2 мл HCl",
react:"С поверхности цинка начали выделяться пузырьки газа. Гранула цинка постепенно уменьшается.",
s3:"Шаг 3. Запиши наблюдения",s3h:"Выбери наблюдаемое явление и запиши уравнение реакции словами.",
rows:["При добавлении кислоты к цинку","Признак химической реакции","Твой прогноз"],
o:[["—","С поверхности цинка выделяются пузырьки газа","Раствор посинел","Выпал белый осадок","Изменений нет"],["—","Выделение газа","Образование осадка","Изменение цвета"],["—","Подтвердился","Не подтвердился"]],
w:["цинк","соляная кислота","хлорид цинка","водород","кислород","вода"],
check:"Проверить",ok3:"Верно! Цинк + соляная кислота → хлорид цинка + водород.",bad3:"Посмотри ещё раз: есть ошибка.",
s4:"Шаг 4. Объясни",q1:"Объясни наблюдаемое явление: почему цинк реагировал с соляной кислотой?",q2:"Вывод",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на все вопросы."}};
const SER=["K","Ca","Na","Mg","Al","Zn","Fe","Ni","Sn","Pb","(H₂)","Cu","Hg","Ag","Au"];
let lang="kk",predSaved=false,done3=false;const S={zn:0,acid:0};const tv={},wv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function render(){
  const x=220,W=80,TOP=90,BOT=350;let h="";
  h+=`<clipPath id="ct"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#ct)"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(S.acid)h+=`<rect x="${x}" y="${BOT-130}" width="${W}" height="130" fill="rgba(200,228,242,.5)"/>`;
  if(S.zn)h+=`<g class="zn" id="zn"><ellipse cx="${x+W/2}" cy="${BOT-22}" rx="18" ry="13" fill="#9aa6b2" stroke="#6b7785" stroke-width="2"/><ellipse cx="${x+W/2-6}" cy="${BOT-27}" rx="6" ry="4" fill="#fff" opacity=".4"/></g>`;
  if(S.acid&&S.zn)for(let k=0;k<22;k++){const cx=x+W/2-16+(k*13)%32,d=(1.1+(k%5)/5).toFixed(2);h+=`<circle class="bub" cx="${cx}" cy="${BOT-30}" r="${2+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*0.09).toFixed(2)}s"/>`}
  h+=`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.6"/><rect x="${x-6}" y="${TOP-12}" width="${W+12}" height="8" rx="3" fill="var(--glassline)"/>`;
  h+=`<rect x="140" y="${BOT-110}" width="240" height="10" rx="4" style="fill:light-dark(#b7c4cd,#3a4b57)" opacity=".7"/>`;
  if(S.acid&&S.zn)h+=`<text x="${x+W+20}" y="${TOP+30}" font-size="16" font-weight="700" fill="var(--acc)">H₂↑</text>`;
  h+=`<text x="${x+W/2}" y="${BOT+30}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${S.zn?"Zn":""}${S.acid?" + HCl":""}</text>`;
  $("scene").innerHTML=h;
  if(S.acid&&S.zn){const z=$("zn");requestAnimationFrame(()=>requestAnimationFrame(()=>z&&(z.style.transform="scale(.55)")))}
}
function renderSteps(){
  const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!predSaved);$("pred").disabled=predSaved;$("savep").disabled=predSaved;$("savep").classList.toggle("done",predSaved);
  document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,done=!!S[k],en=k!=="acid"||S.zn;b.disabled=done||!en;b.classList.toggle("done",done)});
  $("st3").classList.toggle("off",!S.acid);$("st4").classList.toggle("off",!done3);
}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function wsel(id){return `<select id="${id}"><option value="">?</option>${t("w").map((w,i)=>`<option value="${i+1}" ${wv[id]==i+1?"selected":""}>${w}</option>`).join("")}</select>`}
function renderTable(){$("tbl").innerHTML=t("rows").map((r,i)=>`<tr><td>${r}</td><td><select data-r="${i}">${opts(t("o")[i],tv[i])}</select></td></tr>`).join("");
  $("weq").innerHTML=`${wsel("w1")} + ${wsel("w2")} <span>→</span> ${wsel("w3")} + ${wsel("w4")}`;
  const pv=$("pred").value;$("pred").innerHTML=opts(t("po"),pv);$("pred").value=pv;
  $("series").innerHTML=SER.map(s=>`<span class="${s==="(H₂)"?"h":s==="Zn"?"m":""}">${s}</span>`).join("")}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");
  render();renderTable();renderSteps();
}

  const v=["w1","w2","w3","w4"].map(id=>$(id).value),L=[v[0],v[1]].sort().join(),R=[v[2],v[3]].sort().join(),eq=L==="1,2"&&R==="3,4";["w1","w2","w3","w4"].forEach(id=>$(id).className=eq?"ok":"bad");if(!eq)ok=false;
  done3=ok;renderSteps();ok?msg("m3",t("ok3"),true):msg("m3",t("bad3"),false)};
$("send").onclick=()=>{const f=["a1","a2"].every(id=>$(id).value.trim());msg("m4",f?t("sent"):t("empty"),f)};
applyLang();
}
