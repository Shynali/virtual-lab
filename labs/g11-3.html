:root{color-scheme:light dark;

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}

.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}

.scroll{overflow-x:auto}td select{padding:6px;font-size:13px}td input{width:70px;padding:6px;text-align:right;font:600 15px "Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px}

</style>
</head>

qs:[["Какие вещества образуются при взаимодействии уксусной кислоты со спиртом?",["—","Сложный эфир и вода","Соль и водород","Альдегид и вода"],"1"],["Название образовавшегося эфира:",["—","Этилацетат (этиловый эфир уксусной кислоты)","Диэтиловый эфир","Метилформиат"],"1"],["Зачем приёмную пробирку помещают в ледяную воду?",["—","Эфир летуч — его пары нужно охладить, чтобы они сконденсировались","Чтобы эфир замёрз","Чтобы остановить реакцию"],"1"],["Почему эфир оказался в верхнем слое?",["—","Мало растворим в воде и легче воды","Тяжелее воды","Полностью смешивается с водой"],"1"],["Реакция этерификации:",["—","Обратимая, катализатор — H₂SO₄","Необратимая, катализатор не нужен","Окислительно-восстановительная"],"1"]],
check:"Проверить",ok:"Всё верно! Карбоновая кислота и спирт в присутствии серной кислоты вступают в обратимую реакцию этерификации, образуя сложный эфир и воду.",bad:"Неверных ответов: ",
eqm:"Уравнение реакции (H₂SO₄, t°):",
s4:"Вопросы и задания",q1:"1. Какие вещества образуются при взаимодействии уксусной кислоты со спиртом?",q2:"2. Запиши уравнения реакций и объясни способ выделения эфира.",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопросы.",bath:"водяная баня",ice:"вода + лёд",ester:"эфир",aq:"вода + спирт + кислота"}};
let lang="kk",ok=false,view=1,col=0,run=false,shaking=false;const S={mix:0,cond:0,ice:0,heat:0,shake:0,fun:0,tap:0};const qv={},ev={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function bub(x,W,y,n,dur){let s="";for(let k=0;k<n;k++){const cx=x+7+(k*11)%(W-14),d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y}" r="${1.6+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
function lamp(cx,tip,on){return(on?`<path class="flame" d="M${cx} ${tip}c-15 18-17 36-10 50h20c7-14 5-32-10-50z" fill="#f97316" opacity=".9"/><path class="flame" d="M${cx} ${tip+20}c-7 11-8 20-4 30h8c4-10 3-19-4-30z" fill="#fde047"/>`:"")+`<rect x="${cx-3}" y="${tip+48}" width="6" height="10" fill="#57534e"/><path d="M${cx-34} ${tip+110}l8-48h52l8 48z" fill="rgba(200,228,242,.6)" stroke="var(--glassline)" stroke-width="2"/><rect x="${cx-10}" y="${tip+56}" width="20" height="8" rx="2" fill="#a8a29e"/>`}
function v1(){let h="";
  // water bath + flask
  h+=`<path d="M60 180v100q0 12 12 12h156q12 0 12-12V180" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/><rect x="62" y="205" width="176" height="85" fill="rgba(191,219,254,.5)"/><text x="246" y="290" font-size="11" fill="var(--mute)">${t("bath")}</text>`;
  if(run)h+=bub(70,160,284,10,1.3);
  h+=`<path d="M138 120v40c-34 10-44 40-36 70c8 30 84 30 92 0c8-30-2-60-36-70v-40z" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/>`;
  if(S.mix)h+=`<path d="M104 210c-2 10-1 18 2 22c10 26 82 26 90 0c2-6 3-14 2-22z" fill="rgba(240,230,200,.8)"/>`;if(run)h+=bub(110,80,228,8,.9);
  if(S.cond){h+=`<rect x="134" y="104" width="28" height="18" rx="3" fill="#3f3f46"/><path d="M148 106V70L440 130V250" fill="none" stroke="rgba(160,190,205,.95)" stroke-width="7" stroke-linejoin="round"/><path d="M200 70l200 40" stroke="var(--glassline)" stroke-width="22" stroke-linecap="round" opacity=".25"/>`}
  // receiver in ice
  h+=`<path d="M390 220v120q0 12 12 12h76q12 0 12-12V220" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/>`;
  if(S.ice){h+=`<rect x="392" y="245" width="96" height="105" fill="rgba(219,234,254,.7)"/>`;[[400,262],[462,270],[404,312],[466,320],[450,250]].forEach(([x,y])=>h+=`<rect x="${x}" y="${y}" width="16" height="14" rx="3" fill="#f8fafc" stroke="#bae6fd" transform="rotate(15 ${x} ${y})"/>`)}
  const x=420,W=40,TOP=190,BOT=340;h+=`<clipPath id="rc"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#rc)"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>${col>0?`<rect x="${x}" y="${BOT-col*36}" width="${W}" height="${col*36}" fill="#fef3c7"/>`:""}</g><path d="M${x} ${TOP-6}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-6}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(S.cond&&!S.ice)h=h.replace('V250','V160');
  if(run)h+=`<circle cx="440" cy="270" r="3" fill="#fde68a" style="animation:fallD 1s linear infinite"/>`;
  h+=`<text x="440" y="378" text-anchor="middle" font-size="11" fill="var(--mute)">${S.ice?t("ice"):""}</text>`;
  h+=lamp(150,300,run).replace(/tip/g,"");
  return`<style>@keyframes fallD{0%{transform:translateY(-30px);opacity:0}30%{opacity:1}100%{transform:translateY(${50-col*30}px);opacity:0}}</style>`+h}
function v2(){let h="";
  if(!S.fun){const x=250,W=60,TOP=80,BOT=320;let L="";if(S.shake||shaking){L=shaking?`<rect x="${x}" y="${BOT-140}" width="${W}" height="140" fill="#f5efd7"/>`:`<rect x="${x}" y="${BOT-90}" width="${W}" height="90" fill="rgba(200,228,242,.7)"/><rect x="${x}" y="${BOT-140}" width="${W}" height="50" fill="#fde68a" opacity=".85"/>`}else if(col)L=`<rect x="${x}" y="${BOT-50}" width="${W}" height="50" fill="#fef3c7"/>`;
    h+=`<g class="${shaking?"shake":""}"><clipPath id="sc"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#sc)"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>${L}</g><path d="M${x} ${TOP-6}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-6}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/></g>`;
    if(S.shake)h+=`<text x="330" y="${BOT-110}" font-size="13" font-weight="700" fill="#b45309">← ${t("ester")}</text><text x="330" y="${BOT-40}" font-size="13" fill="var(--mute)">← ${t("aq")}</text>`}
  else{// separating funnel
    h+=`<path d="M220 60h120l0 20c0 60-40 110-52 150h-16c-12-40-52-90-52-150z" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/>`;
    const aq=S.tap?0:1;h+=`<clipPath id="fc"><path d="M220 60h120l0 20c0 60-40 110-52 150h-16c-12-40-52-90-52-150z"/></clipPath><g clip-path="url(#fc)">`;
    if(aq)h+=`<rect x="200" y="140" width="160" height="95" fill="rgba(200,228,242,.75)"/><rect x="200" y="100" width="160" height="40" fill="#fde68a" opacity=".85"/>`;else h+=`<rect x="200" y="190" width="160" height="45" fill="#fde68a" opacity=".85"/>`;
    h+=`</g><rect x="274" y="230" width="12" height="60" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2"/><rect x="262" y="244" width="36" height="10" rx="3" fill="#475569" transform="rotate(${S.tap?90:0} 280 249)"/>`;
    h+=`<path d="M230 330v50q0 10 10 10h80q10 0 10-10v-50" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/>`;if(S.tap)h+=`<rect x="232" y="350" width="96" height="38" fill="rgba(200,228,242,.75)"/>`;
    h+=`<text x="350" y="${aq?125:212}" font-size="13" font-weight="700" fill="#b45309">← ${t("ester")}</text>`;if(aq)h+=`<text x="350" y="185" font-size="12" fill="var(--mute)">← ${t("aq")}</text>`}
  return h}
function render(){$("scene").innerHTML=view===1?v1():v2();["v1","v2"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[[["k0","1"],"CH₃COOH + ",["k1","1"],"C₂H₅OH ⇌ ",["k2","1"],"CH₃COOC₂H₅ + ",["k3","1"],"H₂O"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<small style="font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>`+E.map(e=>`<div class="eq">${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!(g&&S.heat&&!run));
  const ORD=["mix","cond","ice","heat","shake","fun","tap"];document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,i=ORD.indexOf(k),en=(i===0||S[ORD[i-1]])&&!run&&!shaking;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st3").classList.toggle("off",!S.tap);$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;
  view=["shake","fun","tap"].includes(k)?2:1;
  if(k==="heat"){S.heat=1;run=true;msg("m1",t("heatm"),true);render();renderSteps();const iv=setInterval(()=>{col=Math.min(1,col+0.1);render();if(col>=1){clearInterval(iv);run=false;msg("m1",t("heat2"),true);render();renderSteps()}},350);return}
  if(k==="shake"){shaking=true;render();renderSteps();setTimeout(()=>{shaking=false;S.shake=1;msg("m2",t("shakem"),true);render();renderSteps()},2000);return}
  S[k]=1;if(k==="tap")msg("m2",t("tapm"),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),aa=el.dataset.a,g=v===aa||(aa==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
