.note{font-size:13px;color:var(--mute);margin:0 0 10px}

.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}

  const A=[190,370],y=150;
  if(view===1){const gap=[0,[0],[-14,14],[-22,0,22]][Math.min(nb,3)]||[];
    if(picked.length===2&&nb>0)(nb>3?[-24,-8,8,24]:gap).forEach(o=>{h+=`<path d="M${A[0]} ${y+o}Q280 ${y+o*1.25} ${A[1]} ${y+o}" fill="none" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>`});
    picked.forEach((p,i)=>h+=atom(A[i],y,44,p===fresh?"pop":""));fresh=-1;
    if(picked.length<2)for(let i=picked.length;i<2;i++)h+=`<circle cx="${A[i]}" cy="${y}" r="40" fill="none" stroke="var(--glassline)" stroke-dasharray="6 6" stroke-width="2"/>`;
    if(picked.length===2)h+=`<text x="280" y="${y+80}" text-anchor="middle" font-size="15" font-weight="600" fill="var(--mute)">${t("bonds")}${nb}</text>`;
  }else{if(picked.length===2){h+=atom(245,y,62)+atom(315,y,62)}else picked.forEach((p,i)=>h+=atom(A[i],y,62))}
  if(f3)h+=`<text x="280" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="var(--acc)" font-family="Noto Serif">:N≡N:</text>`;
  h+=`<rect x="20" y="300" width="520" height="104" rx="14" style="fill:var(--sheet)" stroke="var(--line)"/>`;
  TRAY.forEach(([s,c,tc,id],i)=>{const used=picked.includes(id),cx=60+i*73;if(used){h+=`<circle cx="${cx}" cy="352" r="24" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>`;return}
    h+=`<g class="ball" data-ball="${id}" tabindex="0" role="button" aria-label="${s}"><circle cx="${cx}" cy="352" r="24" fill="${c}" stroke="#64748b" stroke-width="1.5"/><text x="${cx}" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="${tc}" pointer-events="none">${s}</text></g>`});
  $("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){$("val").innerHTML=opts(VAL,sv.val);$("unp").innerHTML=opts(UNP,sv.unp);$("form").innerHTML=opts(FORM,sv.form);
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){$("st2").classList.toggle("off",!f1);$("st3").classList.toggle("off",picked.length<2);$("st4").classList.toggle("off",!f3);$("st5").classList.toggle("off",!ok);
  $("plus").disabled=f3;$("minus").disabled=f3||nb===0;$("chk3").disabled=f3;$("chk3").classList.toggle("done",f3);$("reset").disabled=f3;$("chk1").disabled=f1;$("chk1").classList.toggle("done",f1);
  $("v1").classList.toggle("on",view===1);$("v2").classList.toggle("on",view===2)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("v1").onclick=()=>{view=1;render();renderSteps()};$("v2").onclick=()=>{view=2;render();renderSteps()};
["val","unp","form"].forEach(id=>$(id).onchange=e=>{sv[id]=e.target.value;e.target.className=""});
$("chk1").onclick=()=>{const A={val:"2",unp:"3",form:"3"};let bad=0;for(const k in A){const g=$(k).value===A[k];$(k).className=g?"ok":"bad";if(!g)bad++}
  f1=!bad;f1?msg("m1",t("ok1"),true):msg("m1",t("bad")+bad+".",false);renderSteps()};
function pick(id){if(!f1||picked.length>=2||f3)return;const b=TRAY.find(x=>x[3]===id);if(b[0]!=="N"){msg("m2",t("wrong"),false);return}
  picked.push(id);fresh=id;msg("m2",picked.length===1?t("got1"):t("got2"),true);render();renderSteps()}
$("scene").addEventListener("click",e=>{const g=e.target.closest("[data-ball]");if(g)pick(+g.dataset.ball)});
$("scene").addEventListener("keydown",e=>{const g=e.target.closest("[data-ball]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(+g.dataset.ball)}});
$("reset").onclick=()=>{picked=[];nb=0;$("m2").textContent="";$("m3").textContent="";render();renderSteps()};
$("plus").onclick=()=>{if(nb<4)nb++;$("m3").textContent="";render();renderSteps()};$("minus").onclick=()=>{if(nb>0)nb--;$("m3").textContent="";render();renderSteps()};
$("chk3").onclick=()=>{if(nb===3){f3=true;view=1;msg("m3",t("m3ok"),true)}else msg("m3",nb>3?t("mtoo"):t("m1b"),false);render();renderSteps()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
