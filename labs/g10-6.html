let lang="kk",ok=false,a=0,b=0,acid=0;const S={php:0,blow:0};const qv={},ev={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function bub(x,W,y,n,dur){let s="";for(let k=0;k<n;k++){const cx=x+7+(k*11)%(W-14),d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y}" r="${1.6+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
const CLR="rgba(200,228,242,.55)";
function tube(i){const x=40+i*130,W=60,TOP=100,BOT=300;let liq=null,lh=80,ex="",top="",lab=["A","B","C","D"][i];
  if(i===0){if(a===0)ex=`<rect x="${x+20}" y="${BOT-22}" width="20" height="14" rx="3" fill="#cbd5e1" stroke="#64748b"/>`;
    if(a>=1){liq=CLR;if(a===1){ex=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" fill="#dfe5ec" opacity=".95"/>`+bub(x,W,BOT-14,14,1.1);top="H₂↑"}}}
  if(i===1){if(b===0)ex=`<path d="M${x+14} ${BOT-14}l32-6" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>`;
    if(b>=1){liq=CLR;if(b===1){ex=bub(x,W,BOT-14,16,1);top="H₂↑"}if(b===2){lh=95;ex=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" fill="#e2e8f0" opacity=".85"/><ellipse cx="${x+W/2}" cy="${BOT-12}" rx="24" ry="10" fill="#fff" stroke="rgba(0,0,0,.25)"/>`;top="Mg(OH)₂↓"}if(b===3)lh=105}}
  if(i===2){liq=!S.php?CLR:acid>=3?CLR:acid>=1?"#f9a8d4":"#db2777";lh=80+acid*5}
  if(i===3){liq=CLR;if(S.blow){ex=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" fill="#dfe5ec" opacity=".95"/>`;top="CaCO₃↓"}}
  let h=`<clipPath id="c${i}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${i})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${liq}"/>`;
  h+=ex+`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/><rect x="${x-5}" y="${TOP-12}" width="${W+10}" height="7" rx="3" fill="var(--glassline)"/>`;
  if(i===3&&S.blow)h+=`<path d="M${x+W/2+6} ${TOP-50}V${BOT-20}" stroke="#94a3b8" stroke-width="5" fill="none"/>`;
  const sub=[["Ca","Ca(OH)₂","CaCl₂"][a],["Mg","MgCl₂","Mg(OH)₂","MgSO₄"][b],"Ca(OH)₂",t("lime")][i];
  h+=`<text x="${x+W/2}" y="${BOT+24}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${lab}</text><text x="${x+W/2}" y="${BOT+42}" text-anchor="middle" font-size="12" fill="var(--mute)">${sub}</text>`;
  if(top)h+=`<text x="${x+W/2}" y="${TOP-24}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">${top}</text>`;return h}
function render(){let h="";for(let i=0;i<4;i++)h+=tube(i);$("scene").innerHTML=h}
function chainText(ch,n){return ch.map((s,i)=>(i===0?s[0]:"")+` <span style="color:${i<n?"var(--ok)":"var(--mute)"}">→</span> `+s[1]).join("")}
function renderTrays(){$("chA").innerHTML="а) "+chainText(CHA,a);$("chB").innerHTML="ә) "+chainText(CHB,b);
  const tr=(id,ch,n)=>{$(id).innerHTML=n>=ch.length?"":`<small>${ch[n][0]} → ${ch[n][1]} · ${t("pick")}</small>`+RG.map(r=>`<button class="chip" data-r="${r}" data-c="${id}">${r}</button>`).join("")};
  tr("trA",CHA,a);tr("trB",CHB,b)}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[[["k0","1"],"Ca + ",["k1","2"],"H₂O → ",["k2","1"],"Ca(OH)₂ + H₂↑"],[["k3","1"],"Ca(OH)₂ + ",["k4","2"],"HCl → ",["k5","1"],"CaCl₂ + ",["k6","2"],"H₂O"],
 [["k7","1"],"Mg + ",["k8","2"],"HCl → MgCl₂ + H₂↑"],[["k9","1"],"MgCl₂ + ",["k10","2"],"NaOH → ",["k11","1"],"Mg(OH)₂↓ + ",["k12","2"],"NaCl"],
 [["k13","1"],"Mg(OH)₂ + ",["k14","1"],"H₂SO₄ → ",["k15","1"],"MgSO₄ + ",["k16","2"],"H₂O"],[["k17","1"],"Ca(OH)₂ + ",["k18","1"],"CO₂ → ",["k19","1"],"CaCO₃↓ + H₂O"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<small style="font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>`+E.map(e=>`<div class="eq">${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!g);
  const DEP={acid:"php"};document.querySelectorAll("[data-b]").forEach(x=>{const k=x.dataset.b,done=k==="acid"?acid>=3:!!S[k],en=!DEP[k]||S[DEP[k]];x.disabled=!!done||!en;x.classList.toggle("done",!!done)});
  $("bacid").textContent=t("bacid")+(acid?` (${acid})`:"");
  $("st3").classList.toggle("off",!(a>=2&&b>=3&&acid>=3&&S.blow));$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderTrays();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const c=e.target.closest("[data-r]");
  if(c){const isA=c.dataset.c==="trA",ch=isA?CHA:CHB,n=isA?a:b;if(c.dataset.r===ch[n][2]){if(isA){a++;msg("m1",t("A")[n],true)}else{b++;msg("m2",t("B")[n],true)}render();renderTrays();renderSteps()}else msg(isA?"m1":"m2",t("wrong"),false);return}
  const x=e.target.closest("[data-b]");if(!x||x.disabled)return;const k=x.dataset.b;
  if(k==="acid"){acid++;msg("m3",acid>=3?t("ac2"):t("ac1"),true)}else{S[k]=1;msg("m3",t(k==="php"?"phpm":"blowm"),true)}render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),aa=el.dataset.a,g=v===aa||(aa==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
