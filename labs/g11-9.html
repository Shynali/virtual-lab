  h+=`<path d="M150 400l12-40h196l12 40z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><rect x="170" y="350" width="180" height="12" rx="3" fill="${S.on?"#ef4444":"#475569"}"/><circle cx="185" cy="382" r="6" fill="#334155"/><circle cx="335" cy="382" r="6" fill="#334155"/><text x="260" y="436" text-anchor="middle" font-size="11" fill="var(--mute)">${t("hp")}</text>`;
  // water bath beaker
  h+=`<path d="M190 210v128q0 12 12 12h116q12 0 12-12V210" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/><rect x="192" y="245" width="136" height="103" fill="rgba(191,219,254,.55)"/>`;if(S.on&&temp>90)h+=bub(195,130,345,14,.9);
  // test tube with condenser
  const tx=232,W=36,TOP=150+ty,BOT=320+ty,lv=S.mma?44:0;const g=`<g transform="${S.tilt?`rotate(-60 ${tx+W/2} ${BOT-20})`:""}">`;
  const stc=tmin>=9?2:tmin>=4?1:0,lc=stc===2?"rgba(165,200,240,.95)":stc===1?"rgba(253,246,214,.9)":"rgba(254,249,231,.8)";
  h+=g+`<clipPath id="tt"><rect x="${tx}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${tx}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#tt)"><rect x="${tx}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>${lv?(S.tilt&&stc<2?`<path d="M${tx} ${BOT-lv}h${W}v${lv}h-${W}z" fill="${lc}"/>`:`<rect x="${tx}" y="${BOT-lv}" width="${W}" height="${lv}" fill="${lc}"/>`):""}${S.bpo?[0,1,2,3].map(k=>`<circle cx="${tx+8+k*7}" cy="${BOT-8-(k%2)*5}" r="2.4" fill="#fff" stroke="#cbd5e1"/>`).join(""):""}${stc===2?`<path d="M${tx+8} ${BOT-lv+6}l6 30" stroke="#fff" stroke-width="3" opacity=".8"/>`:""}</g><path d="M${tx} ${TOP-6}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-6}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(S.cond)h+=`<rect x="${tx+4}" y="${TOP-10}" width="${W-8}" height="14" rx="3" fill="#3f3f46"/><rect x="${tx+W/2-4}" y="${TOP-130}" width="8" height="122" fill="rgba(200,228,242,.85)" stroke="var(--glassline)"/>`;h+=`</g>`;
  if(S.cond&&!S.tilt)h+=`<rect x="78" y="${TOP+10}" width="${tx-78+4}" height="8" fill="#94a3b8"/><rect x="${tx-6}" y="${TOP+4}" width="${W+12}" height="20" rx="4" fill="none" stroke="#64748b" stroke-width="3"/>`;
  // thermometer
  if(inB){h+=`<rect x="292" y="140" width="10" height="200" rx="5" fill="#f8fafc" stroke="#94a3b8"/><circle cx="297" cy="336" r="8" fill="#ef4444"/><rect x="295" y="${336-(temp-10)*1.8}" width="4" height="${(temp-10)*1.8}" fill="#ef4444"/><text x="312" y="160" font-size="14" font-weight="700" fill="var(--ink)">${Math.round(temp)} °C</text><text x="312" y="176" font-size="11" fill="var(--mute)">${t("th")}</text>`}
  if(S.on){h+=`<text x="430" y="70" text-anchor="middle" font-size="30" font-weight="700" fill="var(--acc)">${tmin.toFixed(0)} ${t("min")}</text><text x="430" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${t("st")[stc]}</text>`;[0,1,2].forEach(k=>h+=`<rect x="${370+k*42}" y="112" width="38" height="10" rx="4" fill="${k<=stc?"#0f766e":"var(--line)"}"/>`)}
  if(S.cond&&!S.tilt)h+=`<text x="${tx+W/2+14}" y="${TOP-100}" font-size="11" fill="var(--mute)">${t("cnd")}</text>`;
  $("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!(g&&S.bath));
  const ORD=["mma","bpo","cond","bath","on"];document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b;let en;const i=ORD.indexOf(k);if(i>=0)en=i===0||S[ORD[i-1]];else en=tmin>=10&&!run;b.disabled=!!S[k]||!en||run;b.classList.toggle("done",!!S[k])});
  $("st3").classList.toggle("off",!S.tilt);$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;
  if(k==="on"){run=true;msg("m2",t("run1"),true);const iv=setInterval(()=>{if(temp<96){temp=Math.min(96,temp+6)}else{tmin=Math.min(10,tmin+0.5);msg("m2",tmin>=10?t("run3"):t("run2"),true)}render();if(tmin>=10){clearInterval(iv);run=false;renderSteps()}},180);renderSteps();return}
  if(k==="tilt")msg("m2",t("tiltm"),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
