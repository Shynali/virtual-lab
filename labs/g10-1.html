.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}

.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}

.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}

</head>

check:"Проверить",ok:"Всё верно! N₂ и O₂ — газы молекулярного строения, а алмаз имеет атомную решётку и является самым твёрдым природным веществом.",bad:"Неверных ответов: ",
s5:"Задание",q1:"1. Сравни строение соединений.",q2:"2. Исходя из строения веществ, предскажи их свойства.",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопросы."}};
const A=[[-0.075, -0.125, -0.175], [0.175, 0.125, 0.075], [0.175, -0.375, -0.425], [-0.325, -0.375, 0.075], [-0.325, 0.125, -0.425], [-0.075, 0.375, 0.325], [0.425, 0.375, -0.175], [0.425, -0.125, 0.325], [0.425, -0.625, -0.175], [0.675, -0.375, 0.075], [0.175, -0.375, 0.575], [-0.075, -0.625, 0.325], [0.175, -0.875, 0.075], [-0.325, 0.625, 0.075], [-0.575, 0.375, -0.175], [-0.075, 0.375, -0.675], [0.175, 0.625, -0.425], [-0.075, 0.875, -0.175], [-0.325, 0.125, 0.575], [-0.575, -0.125, 0.325]],B=[[1, 0], [2, 0], [5, 1], [6, 1], [3, 0], [4, 0], [7, 1], [8, 2], [9, 7], [9, 8], [10, 7], [11, 3], [11, 10], [12, 8], [12, 11], [13, 5], [14, 4], [14, 13], [15, 4], [16, 6], [16, 15], [17, 13], [17, 16], [18, 5], [19, 3], [19, 18]];
const PTS=["—","1","2","3","4"];
let lang="kk",ok=false,fN=false,fO=false,fC=false,view=1,nC=1,rot=30;const qv={},sv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function ball(sym,cx,cy,r,col,dark,op){return`<g opacity="${op??1}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" stroke="${dark}" stroke-width="2"/><circle cx="${cx-r*.35}" cy="${cy-r*.35}" r="${r*.28}" fill="#fff" opacity=".35"/>${sym?`<text x="${cx}" y="${cy+r*.3}" text-anchor="middle" font-size="${r*.8}" font-weight="700" fill="#fff">${sym}</text>`:""}</g>`}
function diatomic(sym,col,dark,n,done,formula){let h="";const A1=180,A2=380,y=170,offs=[[],[0],[-15,15],[-24,0,24]][n]||[];
  if(done)offs.forEach(o=>h+=`<path d="M${A1} ${y+o}Q280 ${y+o*1.25} ${A2} ${y+o}" fill="none" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>`);
  h+=ball(sym,A1,y,48,col,dark)+ball(sym,A2,y,48,col,dark);
  if(!done){const sel=+(view===1?sv.pN:sv.pO)||0;[A1,A2].forEach((cx,j)=>{for(let k=0;k<sel;k++){const a=(j?Math.PI:0)+(k-(sel-1)/2)*0.55;h+=`<circle cx="${cx+Math.cos(a)*48}" cy="${y+Math.sin(a)*48}" r="6" fill="#facc15" stroke="#a16207"/>`}})}
  if(done)h+=`<text x="280" y="290" text-anchor="middle" font-size="34" font-weight="700" fill="var(--acc)" font-family="Noto Serif">${formula}</text>`;
  return`<text x="280" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${sym}₂</text>`+h}
function diamond(){const a=rot*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),tl=0.45,ct=Math.cos(tl),st=Math.sin(tl),S=165;
  const P=A.map(([x,y,z])=>{const x1=x*ca+z*sa,z1=-x*sa+z*ca;const y1=y*ct-z1*st,z2=y*st+z1*ct;return[280+x1*S,215-y1*S,z2]});
  const n=fC?nC:0;let items=[];
  B.forEach(([i,j])=>{if(i<n&&j<n)items.push([Math.min(P[i][2],P[j][2])-0.01,`<line x1="${P[i][0].toFixed(1)}" y1="${P[i][1].toFixed(1)}" x2="${P[j][0].toFixed(1)}" y2="${P[j][1].toFixed(1)}" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>`])});
  for(let i=0;i<n;i++){const z=P[i][2],r=15+z*5;items.push([z,ball("",P[i][0].toFixed(1),P[i][1].toFixed(1),r.toFixed(1),"#374151","#111827",0.75+z*0.35)])}
  if(!fC){const sel=+sv.pC||0;items.push([-9,ball("C",280,200,40,"#374151","#111827")]);for(let k=0;k<sel;k++){const ang=-Math.PI/2+k*2*Math.PI/Math.max(sel,1);items.push([10,`<circle cx="${280+Math.cos(ang)*40}" cy="${200+Math.sin(ang)*40}" r="6" fill="#facc15" stroke="#a16207"/>`])}}
  items.sort((p,q)=>p[0]-q[0]);
  return`<text x="280" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">C (${t("vdia")})</text>`+items.map(x=>x[1]).join("")+(fC?`<text x="280" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="var(--mute)">${t("cnt")}${nC} / 20</text>`:"")}
function render(){$("scene").innerHTML=view===1?diatomic("N","#2563eb","#1e3a8a",3,fN,"N≡N"):view===2?diatomic("O","#dc2626","#7f1d1d",2,fO,"O=O"):diamond();
  ["v1","v2","v3"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){["pN","pO","pC"].forEach(id=>$(id).innerHTML=opts(PTS,sv[id]));
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){$("st2").classList.toggle("off",!fN);$("st3").classList.toggle("off",!fO);$("st4").classList.toggle("off",!(fC&&nC>=20));$("st5").classList.toggle("off",!ok);
  [["bN",fN],["bO",fO]].forEach(([b,f])=>{$(b).disabled=f;$(b).classList.toggle("done",f)});
  $("add1").disabled=!fC||nC>=20;$("addAll").disabled=!fC||nC>=20;$("pN").disabled=fN;$("pO").disabled=fO;$("pC").disabled=fC}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2,3].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
["pN","pO","pC"].forEach((id,i)=>$(id).onchange=e=>{sv[id]=e.target.value;e.target.className="";view=i+1;
  if(id==="pC"){const g=e.target.value==="4";e.target.className=g?"ok":"bad";if(g){fC=true;msg("m3",t("okC"),true)}else msg("m3",t("badC"),false);renderSteps()}render()});
$("bN").onclick=()=>{view=1;const g=$("pN").value==="3";$("pN").className=g?"ok":"bad";fN=g;g?msg("m1",t("okN"),true):msg("m1",t("badN"),false);render();renderSteps()};
$("bO").onclick=()=>{view=2;const g=$("pO").value==="2";$("pO").className=g?"ok":"bad";fO=g;g?msg("m2",t("okO"),true):msg("m2",t("badO"),false);render();renderSteps()};
function addDone(){if(nC>=20)msg("m3",t("cdone"),true)}
$("add1").onclick=()=>{view=3;nC=Math.min(20,nC+1);addDone();render();renderSteps()};
$("addAll").onclick=()=>{view=3;const iv=setInterval(()=>{nC++;render();if(nC>=20){clearInterval(iv);addDone();renderSteps()}},120);$("addAll").disabled=true;$("add1").disabled=true};
$("rot").oninput=e=>{rot=+e.target.value;view=3;render()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
