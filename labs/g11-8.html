.step{border-top:1px solid var(--line);padding:14px 0}

  if(!f1){$("scene").innerHTML=h;return}
  const cx=280,R=f2||f3?110:110,y0=60,dy=44,items=[];
  const pos=(i,s,half)=>{const th=(tw*(i+(half?.5:0))*36+(tw>0?rot:0))*Math.PI/180+(s?Math.PI:0);return[cx+R*Math.cos(th)*(s?1:1),y0+(i+(half?.5:0))*dy,R*Math.sin(th)]};
  const ball=(p,r,fill,lab,tc)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(r*(1+p[2]/600)).toFixed(1)}" fill="${fill}" stroke="#475569" stroke-width="1.5"/>${lab?`<text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${tc||"#111"}">${lab}</text>`:""}`;
  for(let s=0;s<2;s++)for(let i=0;i<8;i++){const S=pos(i,s,false);items.push([S[2],ball(S,13,"#f8fafc","")]);
    if(i<7){const P=pos(i,s,true),N=pos(i+1,s,false);items.push([Math.min(S[2],P[2])-1,`<line x1="${S[0].toFixed(1)}" y1="${S[1].toFixed(1)}" x2="${P[0].toFixed(1)}" y2="${P[1].toFixed(1)}" stroke="#64748b" stroke-width="3"/>`]);items.push([Math.min(N[2],P[2])-1,`<line x1="${P[0].toFixed(1)}" y1="${P[1].toFixed(1)}" x2="${N[0].toFixed(1)}" y2="${N[1].toFixed(1)}" stroke="#64748b" stroke-width="3"/>`]);items.push([P[2],ball(P,10,"#94a3b8","")])}}
  for(let i=0;i<8;i++){const A=pos(i,0,false),B=pos(i,1,false),M=[(A[0]+B[0])/2,(A[1]+B[1])/2,(A[2]+B[2])/2];const b1=SEQ[i],b2=f2?COMP[b1]:pick[i];
    items.push([Math.min(A[2],M[2])-.5,`<line x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${M[0].toFixed(1)}" y2="${M[1].toFixed(1)}" stroke="${COL[b1]}" stroke-width="9" stroke-linecap="round"/>`]);
    if(b2)items.push([Math.min(B[2],M[2])-.5,`<line x1="${M[0].toFixed(1)}" y1="${M[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}" stroke="${COL[b2]}" stroke-width="9" stroke-linecap="round"/>`]);
    if(tw<0.05){items.push([99,`<text x="${(A[0]+M[0])/2}" y="${A[1]-8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${b1}</text>`]);if(b2)items.push([99,`<text x="${(B[0]+M[0])/2}" y="${B[1]-8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${b2}</text>`])}}
  items.sort((p,q)=>p[0]-q[0]);h+=items.map(x=>x[1]).join("");$("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderPairs(){$("pairs").innerHTML=SEQ.map((b,i)=>`<label style="width:auto"><span style="font-weight:700;color:${COL[b]}">${i+1}. ${b} –</span><select data-p="${i}" style="width:70px">${["","A","T","G","C"].map(x=>`<option value="${x}" ${pick[i]===x?"selected":""}>${x||"—"}</option>`).join("")}</select></label>`).join("")}
function renderQ(){["ns","np"].forEach(id=>$(id).innerHTML=opts(NUM,sv[id]));$("nb").innerHTML=opts(["—","2","4","6"],sv.nb);renderPairs();
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){$("st2").classList.toggle("off",!f1);$("st3").classList.toggle("off",!f2);$("st4").classList.toggle("off",!f3);$("st5").classList.toggle("off",!ok);
  [["b1",f1],["b2",f2],["b3",f3]].forEach(([b,f])=>{$(b).disabled=f;$(b).classList.toggle("done",f)});$("rot").disabled=!f3}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
["ns","np","nb"].forEach(id=>$(id).onchange=e=>{sv[id]=e.target.value;e.target.className=""});
$("b1").onclick=()=>{const A={ns:"6",np:"4",nb:"2"};let bad=0;for(const k in A){const g=$(k).value===A[k];$(k).className=g?"ok":"bad";if(!g)bad++}f1=!bad;f1?msg("m1",t("ok1"),true):msg("m1",t("bad1"),false);render();renderSteps()};
$("pairs").addEventListener("change",e=>{const s=e.target;if(s.dataset.p!=null){pick[+s.dataset.p]=s.value;s.className="";render()}});
$("b2").onclick=()=>{let bad=0;document.querySelectorAll("[data-p]").forEach(s=>{const g=s.value===COMP[SEQ[+s.dataset.p]];s.className=g?"ok":"bad";if(!g)bad++});f2=!bad;f2?msg("m2",t("ok2"),true):msg("m2",t("bad2"),false);render();renderSteps()};
$("b3").onclick=()=>{$("b3").disabled=true;const iv=setInterval(()=>{tw=Math.min(1,tw+0.05);render();if(tw>=1){clearInterval(iv);f3=true;msg("m3",t("m3"),true);renderSteps()}},60)};
$("rot").oninput=e=>{rot=+e.target.value;render()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
