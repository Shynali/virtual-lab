<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қағаз хроматографиясы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm school lab workbook, clear and encouraging (grade 7)
   IDEA: a workbench sheet — two twin tubes, acid and alkali, each with an aluminium granule
   PICTURE: both tubes starting slowly, then fizzing hard once the oxide film is gone: aluminium reacts with both
   COLOUR and TYPE: white sheet on deep lab-teal; the universal-indicator rainbow; Noto Serif + Noto Sans
   LAYOUT: steps left, scene right (sticky) with view switch; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#0f4c5c,#0a2d36);--sheet:light-dark(#ffffff,#13202a);--ink:light-dark(#10131a,#e7edf2);
--mute:light-dark(#566170,#9fb0bf);--line:light-dark(#d5dde5,#2b3d4b);--soft:light-dark(#eef5f7,#182a35);
--acc:light-dark(#0f4c5c,#5cc2d6);--ok:light-dark(#12733a,#4ade80);--bad:light-dark(#b91c1c,#f87171);
--warn:light-dark(#fff4d6,#3a2f12);--glass:light-dark(#f7fbfd,#1d2f3b);--glassline:light-dark(#8aa1b1,#6c8597)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(3vw,12px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:18px}
header small{display:block;opacity:.8;font-size:14px}
h1{font:700 clamp(24px,3.6vw,38px)/1.08 "Noto Serif",Georgia,serif;margin:2px 0 0;text-wrap:balance;max-width:26ch}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#fff;font:600 15px "Noto Sans",Arial,sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button.on{background:#fff;color:#0f4c5c}
.sheet{background:var(--sheet);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:clamp(16px,2.6vw,30px)}
.note{font-size:13px;color:var(--mute);margin:0 0 10px}
.goal{margin:0 0 6px;max-width:70ch}
.reag{margin:0 0 16px;color:var(--mute);font-size:15px;max-width:70ch}
.safety{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.safety p{margin:0;flex:1 1 260px;font-weight:600}
.safety label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,36px);align-items:start}
.step{border-top:1px solid var(--line);padding:14px 0}
.step:first-child{border-top:0;padding-top:0}
.step.off{opacity:.45;pointer-events:none}
h2{font:700 19px/1.2 "Noto Serif",Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
textarea,select{font:16px "Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
textarea{min-height:76px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}
@keyframes glow{50%{fill:#f97316}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
@media(prefers-reduced-motion:reduce){.mag{transition:none}.glow,.flame{animation:none}}
.scroll{overflow-x:auto}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.brown{transition:opacity 2s ease}.pk{transition:fill 1.6s ease}.ca{transition:transform 4s ease-in-out,opacity 6s ease;transform-box:fill-box;transform-origin:center}.water{animation:fall2 .6s linear infinite}@keyframes fall2{from{transform:translateY(-10px);opacity:.9}to{transform:translateY(30px);opacity:.2}}.eq input{width:44px;padding:6px;text-align:center;font:600 16px "Noto Sans",Arial,sans-serif;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tray small{width:100%;font-weight:700;color:var(--mute);font-size:13px;margin-top:4px}
.chip{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:40px}
.chip.sel{border-color:var(--acc);background:var(--soft)}.chip.done{color:var(--ok)}.chip:disabled{opacity:.4;cursor:default}
.scroll{overflow-x:auto}td select{padding:6px;font-size:13px}td input{width:70px;padding:6px;text-align:right;font:600 15px "Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}}
.bub{animation:rise var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.95}100%{transform:translateY(-80px);opacity:0}}
.smoke{animation:smoke 2.6s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.6}100%{transform:translateY(-70px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.bub,.smoke{animation:none;opacity:.6}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;font-size:14px}
td select{padding:6px;font-size:13px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px "Noto Sans",Arial,sans-serif;margin-bottom:10px}
.eq select{width:auto;padding:6px 8px;font:600 15px "Noto Sans",Arial,sans-serif}
.q{margin-bottom:10px}
.toblue{animation:toblue 3.2s ease forwards}@keyframes toblue{from{fill:rgba(200,228,242,.55)}to{fill:#4f9cf5}}
.shrink{animation:shrink 4.5s ease forwards;transform-box:fill-box;transform-origin:center bottom}@keyframes shrink{to{transform:scale(.15);opacity:.2}}
.ring{animation:ringin 1.6s ease forwards;opacity:0}@keyframes ringin{to{opacity:1}}
.liq{transition:fill-opacity 2s ease}
.fade{animation:fade 2.6s ease forwards}@keyframes fade{to{opacity:0}}
.stir{animation:stir .5s ease-in-out 5;transform-box:fill-box;transform-origin:top center}@keyframes stir{50%{transform:rotate(9deg)}}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.board{position:static;order:-1}}
</style>
</head>

  </div>
</div>
</div>

e2:"Получение хроматограммы",e2h:"Отогни язычок бумаги, опусти его в стакан с растворителем внутри эксикатора, закрой крышку. Когда растворитель распределится по хроматограмме, достань бумагу и отметь карандашом границу растворителя.",

e3:"Определение ионов и расчёт Rf",e3h:"Опрыскай бумагу раствором K₄[Fe(CN)₆] из пульверизатора. Измерь линейкой и рассчитай коэффициент подвижности каждого катиона по формуле Rf = l / L (до двух знаков после запятой).",
bspray:"Опрыскать K₄[Fe(CN)₆]",bruler:"Измерить линейкой",sprm:"Появились синее кольцо (берлинская лазурь, Fe³⁺) и коричневое кольцо (Cu₂[Fe(CN)₆], Cu²⁺).",rfok:"Рассчитано верно!",rfbad:"Пересчитай: l — расстояние от внешней линии начального пятна до внешней границы кольца, L — расстояние от центра бумаги до границы растворителя.",
s4:"Вопросы",s4h:"Выбери ответ.",
qs:[["Какую окраску дают ионы Fe³⁺ с K₄[Fe(CN)₆]?",["—","Синюю (берлинская лазурь)","Коричневую","Красную"],"1"],["Какую окраску дают ионы Cu²⁺ с K₄[Fe(CN)₆]?",["—","Коричневую","Синюю","Жёлтую"],"1"],["Какой ион продвинулся с растворителем дальше по бумаге?",["—","Fe³⁺","Cu²⁺","Одинаково"],"1"],["Почему отметки делают карандашом, а не ручкой?",["—","Графит не растворяется в растворителе, а чернила растворяются и перемещаются","Карандаш ярче","Разницы нет"],"1"],["Основа хроматографического разделения:",["—","Различная адсорбция веществ на бумаге и растворимость в растворителе","Одинаковая масса веществ","Цвет веществ"],"1"]],
check:"Проверить",ok:"Всё верно! Ионы по-разному адсорбируются бумагой и по-разному растворяются в растворителе, поэтому движутся с разной скоростью и разделяются.",bad:"Неверных ответов: ",
s5:"Вывод",q1:"Опиши, что ты наблюдал на хроматограмме, сравни значения Rf и сделай вывод.",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопрос.",side:"эксикатор",paper:"фильтровальная бумага",tg:"язычок",mm:"мм"}};
let lang="kk",ok=false,rfOk=false,front=0,running=false;const S={tongue:0,drop:0,circle:0,place:0,out:0,spray:0,ruler:0};const qv={};
const K=3.4,CX=200,CY=212,R0=3,LF=40,FE=35,CU=20; // mm
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function render(){let h=`<circle cx="${CX}" cy="${CY}" r="${52*K}" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="${CX}" y="${CY-52*K-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${t("paper")}</text>`;
  if(S.tongue){const y1=CY-2*K,y2=CY+2*K,x1=CX-52*K+2,x2=CX-12*K;h+=`<path d="M${x1} ${y1}H${x2}M${x1} ${y2}H${x2}" stroke="#334155" stroke-width="1.5"/><path d="M${x2} ${y1}V${y2}" stroke="#334155" stroke-dasharray="3 3"/><text x="${(x1+x2)/2}" y="${y1-6}" text-anchor="middle" font-size="11" fill="var(--mute)">${t("tg")} 40×4 ${t("mm")}</text>`}
  const fr=front*K;
  if(fr>0)h+=`<circle cx="${CX}" cy="${CY}" r="${fr}" fill="rgba(186,230,253,.45)"/>`;
  if(S.out)h+=`<circle cx="${CX}" cy="${CY}" r="${LF*K}" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  if(S.drop&&front<=R0+.5)h+=`<circle cx="${CX}" cy="${CY}" r="${R0*K}" fill="#d9f99d" opacity=".9"/>`;
  if(front>R0+.5&&!S.spray){const fe=Math.min(front*FE/LF,FE),cu=Math.min(front*CU/LF,CU);h+=`<circle cx="${CX}" cy="${CY}" r="${fe*K}" fill="none" stroke="#fde68a" stroke-width="6" opacity=".55"/><circle cx="${CX}" cy="${CY}" r="${cu*K}" fill="none" stroke="#bae6fd" stroke-width="6" opacity=".5"/>`}
  if(S.spray)h+=`<g class="ring"><circle cx="${CX}" cy="${CY}" r="${(FE-1.25)*K}" fill="none" stroke="#1d4ed8" stroke-width="${2.5*K}"/><circle cx="${CX}" cy="${CY}" r="${(CU-1.25)*K}" fill="none" stroke="#92400e" stroke-width="${2.5*K}"/></g>`;
  if(S.circle)h+=`<circle cx="${CX}" cy="${CY}" r="${R0*K}" fill="none" stroke="#334155" stroke-width="1.5"/>`;
  if(S.ruler){const y=CY;const seg=(r1,r2,yy,col,lab)=>`<line x1="${CX+r1*K}" y1="${yy}" x2="${CX+r2*K}" y2="${yy}" stroke="${col}" stroke-width="2.5" marker-end="url(#ae)" marker-start="url(#as)"/><text x="${CX+(r1+r2)/2*K}" y="${yy-6}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}" paint-order="stroke" stroke="#fff" stroke-width="4">${lab}</text>`;
    h+=`<defs><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 0 5 10 10z" fill="context-stroke"/></marker></defs>`;
    h+=seg(0,LF,y+28,"#334155",`L = ${LF} ${t("mm")}`)+seg(R0,FE,y-42,"#1d4ed8",`l(Fe³⁺) = ${FE-R0} ${t("mm")}`)+seg(R0,CU,y-18,"#92400e",`l(Cu²⁺) = ${CU-R0} ${t("mm")}`);
    h+=`<text x="${CX}" y="${CY+18}" text-anchor="middle" font-size="11" fill="#334155" paint-order="stroke" stroke="#fff" stroke-width="3">r₀ = ${R0} ${t("mm")}</text>`}
  // side inset
  const ix=420,iy=120;h+=`<g opacity="${S.place&&!S.out?1:.35}"><path d="M${ix} ${iy+40}h120v120q0 20-20 20h-80q-20 0-20-20z" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2"/><path d="M${ix-6} ${iy+40}q66-40 132 0z" fill="var(--glassline)" opacity=".5"/>`;
  h+=`<rect x="${ix+35}" y="${iy+90}" width="50" height="60" fill="none" stroke="var(--glassline)" stroke-width="2"/><rect x="${ix+36}" y="${iy+125}" width="48" height="24" fill="rgba(186,230,253,.7)"/>`;
  if(S.place)h+=`<path d="M${ix+20} ${iy+88}h80" stroke="#94a3b8" stroke-width="3"/><path d="M${ix+60} ${iy+88}v50" stroke="#94a3b8" stroke-width="3"/>`;
  h+=`<text x="${ix+60}" y="${iy+200}" text-anchor="middle" font-size="12" fill="var(--mute)">${t("side")}</text></g>`;
  $("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!(g&&S.circle));$("st3").classList.toggle("off",!S.out);
  const DEP={drop:"tongue",circle:"drop",spray:"out",ruler:"spray"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b;let en=!DEP[k]||S[DEP[k]];if(k==="out")en=S.place&&front>=LF&&!running;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("rfFe").disabled=$("rfCu").disabled=$("chkrf").disabled=!S.ruler||rfOk;$("chkrf").classList.toggle("done",rfOk);
  $("st4").classList.toggle("off",!rfOk);$("st5").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;
  if(k==="drop"){front=R0;msg("m1",t("dropm"),true)}if(k==="circle")msg("m1",t("circm"),true);
  if(k==="place"){running=true;msg("m2",t("run"),true);const iv=setInterval(()=>{front=Math.min(LF,front+1);render();if(front>=LF){clearInterval(iv);running=false;msg("m2",t("ready"),true);renderSteps()}},90)}
  if(k==="out")msg("m2",t("outm"),true);if(k==="spray")msg("m3",t("sprm"),true);
  render();renderSteps()});
$("chkrf").onclick=()=>{const f=parseFloat($("rfFe").value.replace(",",".")),c=parseFloat($("rfCu").value.replace(",","."));const gf=Math.abs(f-(FE-R0)/LF)<=0.02,gc=Math.abs(c-(CU-R0)/LF)<=0.02;
  $("rfFe").className=gf?"ok":"bad";$("rfCu").className=gc?"ok":"bad";rfOk=gf&&gc;msg("m3",rfOk?t("rfok")+` Rf(Fe³⁺) = ${((FE-R0)/LF).toFixed(2)}, Rf(Cu²⁺) = ${String((CU-R0)/LF)}.`:t("rfbad"),rfOk);renderSteps()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
