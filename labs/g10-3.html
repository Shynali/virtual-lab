:root{color-scheme:light dark;

const ANS=[["1","1"],["1","1"],["2","2"]];
function beaker(x,y,W,H,fill,op,label,sub){let h=`<path d="M${x} ${y}V${y+H-12}q0 12 12 12h${W-24}q12 0 12-12V${y}" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/>`;
  if(fill)h+=`<path class="liq" d="M${x+2} ${y+H*0.4}V${y+H-12}q0 10 10 10h${W-24}q10 0 10-10V${y+H*0.4}z" style="fill:${fill};fill-opacity:${op}"/>`;
  if(label)h+=`<text x="${x+W/2}" y="${y+H+22}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${label}</text>`;
  if(sub)h+=`<text x="${x+W/2}" y="${y+H+38}" text-anchor="middle" font-size="12" fill="var(--mute)">${sub}</text>`;return h}
function render(){let h="";
  if(!S.split){const x=180,y=80,W=200,H=240;let fill=null,op=0;if(S.fe&&!S.scn){fill="#eab308";op=.45}if(!S.fe&&S.scn){fill="#e0f2fe";op=.7}if(S.fe&&S.scn){fill=S.mix?"#b91c1c":"#d97706";op=S.mix?.6:.5}
    h+=beaker(x,y,W,H,fill,op,"500 мл");if(stirring)h+=`<g class="stir"><rect x="${x+W/2-3}" y="${y-40}" width="6" height="${H+20}" rx="3" fill="rgba(180,210,225,.8)" stroke="var(--glassline)"/></g>`}
  else{h+=`<rect x="30" y="40" width="500" height="250" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="280" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">${t("screen")}</text>`;
    const OP=[.6,S.a2?.95:.6,S.a3?.95:.6,S.a4?.28:.6];const sub=["",S.a2?"+FeCl₃":"",S.a3?"+KSCN":"",S.a4?"+KCl":""];
    for(let i=0;i<4;i++)h+=beaker(60+i*120,130,90,150,"#b91c1c",OP[i],`${i+1}`,i===0?t("ref"):sub[i]);
    if(S.a4)for(let k=0;k<6;k++)h+=`<rect x="${438+k*9}" y="${266-(k%2)*4}" width="7" height="7" fill="#fff" stroke="#cbd5e1" opacity=".9"/>`}
  $("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[["k0","1"],"FeCl₃ + ",["k1","3"],"KSCN ⇌ ",["k2","1"],"Fe(SCN)₃ + ",["k3","3"],"KCl"];
function renderQ(){$("tb").innerHTML=t("rows").map((r,i)=>`<tr><td>${r}</td><td><select data-t="${i}_0">${opts(t("col"),tv[i+"_0"])}</select></td><td><select data-t="${i}_1">${opts(t("dir"),tv[i+"_1"])}</select></td></tr>`).join("");
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<div class="eq"><small style="width:100%;font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>${E.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!(g&&S.mix));
  const DEP={mix:["fe","scn"],a2:["split"],a3:["split"],a4:["split"]};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b;const en=(DEP[k]||[]).every(d=>S[d])&&!stirring;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st3").classList.toggle("off",!(S.a2&&S.a3&&S.a4));$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;
  if(k==="mix"){stirring=true;render();renderSteps();setTimeout(()=>{stirring=false;S.mix=1;render();renderSteps();msg("m1",t("mixm"),true)},1800);return}
  if(k==="a2"||k==="a3"||k==="a4"){S[k]=1;render();renderSteps();msg("m2",t("m"+k[1]+"a"),true);return}
  S[k]=1;render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}if(s.dataset.t){tv[s.dataset.t]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("[data-t]").forEach(s=>{const[i,j]=s.dataset.t.split("_");const g=s.value===ANS[i][j];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),a=el.dataset.a,g=v===a||(a==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
