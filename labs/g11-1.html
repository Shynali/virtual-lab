function proj([x,y]){const tt=tilt*Math.PI/180;return[280+x,218-y*Math.cos(tt),y*Math.sin(tt)]}
function render(){let h=`<text x="40" y="34" font-size="17" font-weight="700" fill="var(--ink)">C₆H₆</text>`;
  if(!f1){$("scene").innerHTML=h+`<text x="280" y="210" text-anchor="middle" font-size="14" fill="var(--mute)">?</text>`;return}
  const RC=96,RH=158,C=[...Array(6)].map((_,k)=>proj(P(RC,k))),H=[...Array(6)].map((_,k)=>proj(P(RH,k)));let items=[];
  for(let k=0;k<6;k++){items.push([Math.min(C[k][2],H[k][2])-.5,`<line x1="${C[k][0]}" y1="${C[k][1]}" x2="${H[k][0]}" y2="${H[k][1]}" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>`])}
  for(let k=0;k<6;k++){const a=C[k],b=C[(k+1)%6],z=Math.min(a[2],b[2])-.4;let s=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>`;
    if(!f3&&dbl[k]){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,cx=280,cy=218,dx=cx-mx,dy=cy-my,L=Math.hypot(dx,dy),ox=dx/L*14,oy=dy/L*14;s+=`<line x1="${a[0]*.8+b[0]*.2+ox}" y1="${a[1]*.8+b[1]*.2+oy}" x2="${a[0]*.2+b[0]*.8+ox}" y2="${a[1]*.2+b[1]*.8+oy}" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>`}
    if(!f2)s=`<g class="edge" data-e="${k}" tabindex="0" role="button" aria-label="bond ${k+1}">${s}<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="26"/></g>`;
    items.push([z,s])}
  if(f3)items.push([9,`<ellipse cx="280" cy="218" rx="56" ry="${(56*Math.cos(tilt*Math.PI/180)).toFixed(1)}" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="2 0" opacity=".8"/>`]);
  const ball=(x,y,r,f,s,tc,e)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${s}" stroke-width="2"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.28}" fill="#fff" opacity=".35"/><text x="${x}" y="${y+r*.33}" text-anchor="middle" font-size="${r*.85}" font-weight="700" fill="${tc}" pointer-events="none">${e}</text>`;
  for(let k=0;k<6;k++){items.push([C[k][2],ball(C[k][0],C[k][1],21,"#1f2937","#000","#fff","C")]);items.push([H[k][2],ball(H[k][0],H[k][1],14,"#f8fafc","#94a3b8","#111","H")])}
  items.sort((p,q)=>p[0]-q[0]);h+=items.map(x=>x[1]).join("");
  if(f1&&!f2)h+=`<text x="280" y="405" text-anchor="middle" font-size="13" fill="var(--mute)">${t("tap")}</text>`;
  if(f3)h+=`<text x="280" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">C–C = 0,139 нм · 120°</text>`;
  $("scene").innerHTML=h}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const FORMS=()=>lang==="kk"?["—","Ашық тізбек","Тұйық алты мүшелі сақина","Тармақталған тізбек"]:["—","Открытая цепь","Замкнутое шестичленное кольцо","Разветвлённая цепь"];
function renderQ(){$("nc").innerHTML=opts(NUM,sv.nc);$("nh").innerHTML=opts(NUM,sv.nh);$("form").innerHTML=opts(FORMS(),sv.form);
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){$("st2").classList.toggle("off",!f1);$("st3").classList.toggle("off",!f2);$("st4").classList.toggle("off",!f3);$("st5").classList.toggle("off",!ok);
  $("b1").disabled=f1;$("b1").classList.toggle("done",f1);$("b2").disabled=f2;$("b2").classList.toggle("done",f2);$("clr").disabled=f2;$("b3").disabled=f3;$("b3").classList.toggle("done",f3);$("tilt").disabled=!f3}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
["nc","nh","form"].forEach(id=>$(id).onchange=e=>{sv[id]=e.target.value;e.target.className=""});
$("b1").onclick=()=>{const A={nc:"3",nh:"3",form:"2"};let bad=0;for(const k in A){const g=$(k).value===A[k];$(k).className=g?"ok":"bad";if(!g)bad++}f1=!bad;f1?msg("m1",t("ok1"),true):msg("m1",t("bad1"),false);render();renderSteps()};
function tog(k){if(!f1||f2)return;dbl[k]=dbl[k]?0:1;$("m2").textContent="";render()}
$("scene").addEventListener("click",e=>{const g=e.target.closest("[data-e]");if(g)tog(+g.dataset.e)});
$("scene").addEventListener("keydown",e=>{const g=e.target.closest("[data-e]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tog(+g.dataset.e)}});
$("clr").onclick=()=>{dbl.fill(0);render()};
$("b2").onclick=()=>{let good=true;for(let k=0;k<6;k++){const n=dbl[k]+dbl[(k+5)%6];if(n!==1)good=false}f2=good;good?msg("m2",t("ok2"),true):msg("m2",t("bad2a"),false);render();renderSteps()};
$("b3").onclick=()=>{f3=true;msg("m3",t("m3"),true);render();renderSteps()};
$("tilt").oninput=e=>{tilt=+e.target.value;render()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
