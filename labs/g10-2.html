const RATE=[5,0.6,24],COL=["rgba(147,197,253,.75)","rgba(200,228,242,.55)","#1d4ed8"];
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function bub(x,W,y,n,dur,h){let s="";for(let k=0;k<n;k++){const cx=x+6+(k*11)%(W-12),d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y-(k*13)%Math.max(h-10,1)}" r="${1.5+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
function cyl(i){const x=105+i*140,W=56,TOP=60,BOT=370,sc=(BOT-TOP)/250;const has=S["c"+(i+1)];const vol=has?50+(S.h2o2?10:0):0,lh=vol*sc;
  const foam=S.h2o2?Math.min(RATE[i]*tt,180):0;
  let h=`<g clip-path="url(#k${i})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(has)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${COL[i]}"/>`;
  if(foam>1){const fy=BOT-lh-foam;h+=`<rect x="${x}" y="${fy}" width="${W}" height="${foam}" fill="${i===2?"#bfdbfe":"#eef6fb"}"/>`;for(let k=0;k<Math.floor(foam/6);k++)h+=`<circle cx="${x+5+(k*13)%(W-10)}" cy="${fy+4+(k*7)%Math.max(foam-6,1)}" r="${3+k%3}" fill="#fff" stroke="#cbd5e1" stroke-width=".8"/>`}
  if(S.h2o2&&has&&RATE[i]>1)h+=bub(x,W,BOT-6,i===2?20:8,i===2?.7:1.8,lh);
  h+=`</g>`;
  for(let v=50;v<=250;v+=50){const y=BOT-v*sc;h+=`<line x1="${x}" y1="${y}" x2="${x+12}" y2="${y}" stroke="var(--glassline)" stroke-width="1.5"/><text x="${x-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mute)">${v}</text>`}
  h+=`<path d="M${x} ${TOP-6}V${BOT}h${W}V${TOP-6}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/><path d="M${x-14} ${BOT+2}h${W+28}l-6 10h-${W+16}z" fill="var(--glassline)"/>`;
  h+=`<text x="${x+W/2}" y="${BOT+36}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${i+1} · ${["CuSO₄","NH₄OH","CuSO₄+NH₄OH"][i]}</text>`;
  if(i===2&&S.spl){const sx=x+W/2;h+=`<line x1="${sx+60}" y1="${TOP-50}" x2="${sx+4}" y2="${TOP-14}" stroke="#a16207" stroke-width="5" stroke-linecap="round"/><path class="flame" d="M${sx+2} ${TOP-40}c-10 10-11 20-5 28h12c6-8 5-18-7-28z" fill="#fde047" stroke="#f97316" stroke-width="2"/>`}
  return`<clipPath id="k${i}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}"/></clipPath>`+h}
function render(){$("scene").innerHTML=cyl(0)+cyl(1)+cyl(2)}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[[["k0","2"],"H₂O₂ → ",["k1","2"],"H₂O + ",["k2","1"],"O₂↑"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=E.map(e=>`<div class="eq"><small style="width:100%;font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!(g&&S.c1&&S.c2&&S.c3));
  document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b;let en=true;if(k==="spl")en=S.h2o2&&!run;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st3").classList.toggle("off",!S.spl);$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;
  if(k==="c3")msg("m1",t("c3m"),true);
  if(k==="h2o2"){run=true;msg("m2",t("go"),true);const iv=setInterval(()=>{tt+=0.5;render();if(tt>=8){clearInterval(iv);run=false;msg("m2",t("gdone"),true);renderSteps()}},250)}
  if(k==="spl")msg("m2",t("splm"),true);
  render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),a=el.dataset.a,g=v===a||(a==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
