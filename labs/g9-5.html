<style>
/* VOICE: calm school lab workbook, clear and encouraging (grade 7)
   IDEA: a workbench sheet — five small stations, one per test for an anion, switched like pages
   PICTURE: white, cream and yellow silver precipitates against white paper; barium sulfate; limewater clouding; brown gas; silicic acid gel
   COLOUR and TYPE: white sheet on deep lab-teal; the universal-indicator rainbow; Noto Serif + Noto Sans
   LAYOUT: steps left, scene right (sticky) with view switch; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#0f4c5c,#0a2d36);--sheet:light-dark(#ffffff,#13202a);--ink:light-dark(#10131a,#e7edf2);
--mute:light-dark(#566170,#9fb0bf);--line:light-dark(#d5dde5,#2b3d4b);--soft:light-dark(#eef5f7,#182a35);
--acc:light-dark(#0f4c5c,#5cc2d6);--ok:light-dark(#12733a,#4ade80);--bad:light-dark(#b91c1c,#f87171);
--warn:light-dark(#fff4d6,#3a2f12);--glass:light-dark(#f7fbfd,#1d2f3b);--glassline:light-dark(#8aa1b1,#6c8597)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(3vw,12px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:18px}
header small{display:block;opacity:.8;font-size:14px}
h1{font:700 clamp(24px,3.6vw,38px)/1.08 "Noto Serif",Georgia,serif;margin:2px 0 0;text-wrap:balance;max-width:26ch}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#fff;font:600 15px "Noto Sans";padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button.on{background:#fff;color:#0f4c5c}
.sheet{background:var(--sheet);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:clamp(16px,2.6vw,30px)}
.note{font-size:13px;color:var(--mute);margin:0 0 10px}
.goal{margin:0 0 6px;max-width:70ch}
.reag{margin:0 0 16px;color:var(--mute);font-size:15px;max-width:70ch}
.safety{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.safety p{margin:0;flex:1 1 260px;font-weight:600}
.safety label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,36px);align-items:start}
.step{border-top:1px solid var(--line);padding:14px 0}
.step:first-child{border-top:0;padding-top:0}
.step.off{opacity:.45;pointer-events:none}
h2{font:700 19px/1.2 "Noto Serif",Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
textarea,select{font:16px "Noto Sans";color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
textarea{min-height:76px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans";cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans";padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}
@keyframes glow{50%{fill:#f97316}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
@media(prefers-reduced-motion:reduce){.mag{transition:none}.glow,.flame{animation:none}}
.scroll{overflow-x:auto}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans";padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.brown{transition:opacity 2s ease}.eq input{width:44px;padding:6px;text-align:center;font:600 16px "Noto Sans";border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tray small{width:100%;font-weight:700;color:var(--mute);font-size:13px;margin-top:4px}
.chip{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px "Noto Sans";cursor:pointer;min-height:40px}
.chip.sel{border-color:var(--acc);background:var(--soft)}.chip.done{color:var(--ok)}.chip:disabled{opacity:.4;cursor:default}
.scroll{overflow-x:auto}td select{padding:6px;font-size:13px}td input{width:70px;padding:6px;text-align:right;font:600 15px "Noto Sans";color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}}

.smoke{animation:smoke 2.6s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.6}100%{transform:translateY(-70px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.bub,.smoke{animation:none;opacity:.6}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;font-size:14px}
td select{padding:6px;font-size:13px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px "Noto Sans";margin-bottom:10px}
.eq select{width:auto;padding:6px 8px;font:600 15px "Noto Sans"}
.q{margin-bottom:10px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.board{position:static;order:-1}}
</style>
</head>

</div>

s6:"Запиши результаты в таблицу",s6h:"Для каждого аниона выбери реагент, наблюдение и сокращённое ионное (для NO₃⁻ — молекулярное) уравнение.",can:"Анион",crg:"Реагент",cob:"Наблюдение",ceq:"Уравнение",
rg:["—","AgNO₃","BaCl₂","HCl/HNO₃ (газ → изв. вода)","Cu + конц. H₂SO₄","HCl"],
ob:["—","Белый творожистый осадок","Светло-жёлтый осадок","Жёлтый осадок","Белый осадок","Выделяется газ, известковая вода мутнеет","Выделяется бурый газ","Белый студенистый (гелеобразный) осадок"],
qg:"Какой групповой реагент можно использовать для определения анионов Cl⁻, Br⁻, I⁻, PO₄³⁻?",go:["— выбери —","AgNO₃ (ион Ag⁺)","BaCl₂ (ион Ba²⁺)","NaOH (ион OH⁻)"],
check:"Проверить",ok6:"Таблица заполнена верно!",bad6:"Ошибки для анионов: ",
s7:"Вывод",q1:"Как отличить галогенид-ионы (Cl⁻, Br⁻, I⁻) друг от друга?",q2:"Вывод",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на все вопросы.",tap:"нажми",hood:"вытяжной шкаф",lime:"изв. вода"}};
const EQ=["—","Ag⁺ + Cl⁻ → AgCl↓","Ag⁺ + Br⁻ → AgBr↓","Ag⁺ + I⁻ → AgI↓","3Ag⁺ + PO₄³⁻ → Ag₃PO₄↓","Ba²⁺ + SO₄²⁻ → BaSO₄↓","CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O","Cu + 2NaNO₃ + 2H₂SO₄ → CuSO₄ + Na₂SO₄ + 2NO₂↑ + 2H₂O","SiO₃²⁻ + 2H⁺ → H₂SiO₃↓","Ag⁺ + PO₄³⁻ → AgPO₄↓"];
const AN=[{a:"Cl⁻",r:"1",o:"1",e:"1"},{a:"Br⁻",r:"1",o:"2",e:"2"},{a:"I⁻",r:"1",o:"3",e:"3"},{a:"PO₄³⁻",r:"1",o:"3",e:"4"},{a:"SO₄²⁻",r:"2",o:"4",e:"5"},{a:"CO₃²⁻",r:"3",o:"5",e:"6"},{a:"NO₃⁻",r:"4",o:"6",e:"7"},{a:"SiO₃²⁻",r:"5",o:"7",e:"8"}];
const E1=[{s:"KCl",p:"#fafafa",d:"#cbd5e1"},{s:"KBr",p:"#fef3c7",d:"#e5c07b"},{s:"KI",p:"#fde047",d:"#ca8a04"},{s:"K₃PO₄",p:"#facc15",d:"#a16207"}];
let lang="kk",view=1,d6=false;const S={p1:0,s2:0,ba:0,s3:0,lw:0,ac:0,s4:0,h2so4:0,s5:0,hcl:0};const ag=new Set();const tv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function tube(x,W,TOP,BOT,liq,col,inner,label,sub){let h=`<clipPath id="c${x}${TOP}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x}${TOP})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-liq}" width="${W}" height="${liq}" fill="${col}"/>`;
  h+=inner+`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.2"/>`;
  return h+`<text x="${x+W/2}" y="${BOT+24}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${label}</text>`+(sub?`<text x="${x+W/2}" y="${BOT+42}" text-anchor="middle" font-size="12" fill="var(--mute)">${sub}</text>`:"");}
function flocs(x,W,BOT,n,col,dark,h){let s="";for(let k=0;k<n;k++){const a=x+7+(k*23)%(W-14),b=BOT-6-(k*9)%(h||36);s+=`<ellipse cx="${a}" cy="${b}" rx="${4+(k%3)}" ry="${3.4+(k%2)}" fill="${col}" stroke="${dark}" stroke-width=".6"/>`}return s}
function bub(x,W,y,n,dur){let s="";for(let k=0;k<n;k++){const cx=x+8+(k*13)%(W-16),d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y}" r="${1.8+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
const CLR="rgba(220,235,245,.6)";
function scene1(){let h=`<rect x="30" y="60" width="500" height="250" rx="8" fill="#ffffff" stroke="#e5e7eb"/>`;
  E1.forEach((o,i)=>{const x=70+i*120,on=ag.has(i);h+=`<g class="tb" data-k="${i}" style="cursor:pointer">`+tube(x,50,90,290,S.p1?(on?90:75):0,CLR,on?flocs(x,50,290,20,o.p,o.d):"",o.s,on?"+ AgNO₃":"");
    if(S.p1&&!on)h+=`<text x="${x+25}" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="var(--acc)">${t("tap")}</text>`;h+=`</g>`});return h}
function scene2(){return tube(240,70,90,320,S.s2?(S.ba?100:80):0,CLR,S.ba?flocs(240,70,320,26,"#fafafa","#cbd5e1"):"","Na₂SO₄",S.ba?"+ BaCl₂ → BaSO₄↓":"")}
function scene3(){let h=tube(120,60,120,330,S.s3?(S.ac?90:70):0,CLR,S.ac?bub(120,60,300,14,1.1):"","K₂CO₃",S.ac?"+ HCl":"");
  h+=tube(340,60,120,330,S.lw?100:0,CLR,S.ac?`<rect x="340" y="230" width="60" height="100" fill="#f5f5f0" opacity=".85"/>`+bub(340,60,310,8,1.3):"",t("lime"),S.ac?"CaCO₃↓":"");
  if(S.ac)h+=`<path d="M108 98H192L188 126H112Z" fill="#7c5a3c"/><path d="M150 98V60H370V310" fill="none" stroke="light-dark(#9fb7c7,#6c8597)" stroke-width="5" opacity=".9"/>`;return h}
function scene4(){let inner="";if(S.s4){inner+=flocs(240,70,320,10,"#fafafa","#cbd5e1",10)+`<path d="M258 316C266 270 286 290 282 230" stroke="#c8733a" stroke-width="5" fill="none" stroke-linecap="round"/>`}
  if(S.h2so4)inner+=`<rect class="brown" id="brn" x="240" y="90" width="70" height="170" fill="#b45309" opacity="0"/>`+bub(240,70,315,8,1.4);
  let h=`<rect x="180" y="30" width="190" height="20" rx="4" fill="#374151"/><text x="275" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${t("hood")}</text>`;
  h+=tube(240,70,90,320,S.h2so4?60:0,"rgba(96,165,250,.35)",inner,"NaNO₃ + Cu",S.h2so4?"+ H₂SO₄ (конц.) → NO₂↑":"");return h}
function scene5(){return tube(240,70,90,320,S.s5?(S.hcl?110:70):0,CLR,S.hcl?`<rect x="240" y="${320-80}" width="70" height="80" fill="#f8fafc" opacity=".85"/>`+flocs(240,70,320,14,"#f1f5f9","#cbd5e1",60):"","Na₂SiO₃",S.hcl?"+ HCl → H₂SiO₃↓":"")}
function render(){$("scene").innerHTML=[0,scene1,scene2,scene3,scene4,scene5][view]();document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",+b.dataset.v===view));
  const br=$("brn");if(br)requestAnimationFrame(()=>requestAnimationFrame(()=>br.setAttribute("opacity",.55)))}
const DEP={ba:"s2",ac:"lw",lw:"s3",h2so4:"s4",hcl:"s5"},VIEW={p1:1,s2:2,ba:2,s3:3,lw:3,ac:3,s4:4,h2so4:4,s5:5,hcl:5};
function allDone(){return ag.size===4&&S.ba&&S.ac&&S.h2so4&&S.hcl}
function renderSteps(){const g=$("goggles").checked;["st1","st2","st3","st4","st5"].forEach(id=>$(id).classList.toggle("off",!g));
  document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,done=!!S[k],en=!DEP[k]||S[DEP[k]];b.disabled=done||!en;b.classList.toggle("done",done)});
  $("st6").classList.toggle("off",!allDone());$("st7").classList.toggle("off",!d6)}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderTable(){$("tbl").innerHTML=AN.map((a,i)=>`<tr><td>${a.a}</td><td><select data-r="${i}" data-k="r">${opts(t("rg"),tv[i+"r"])}</select></td><td><select data-r="${i}" data-k="o">${opts(t("ob"),tv[i+"o"])}</select></td><td><select data-r="${i}" data-k="e">${opts(EQ,tv[i+"e"])}</select></td></tr>`).join("");
  const g=$("grp").value;$("grp").innerHTML=opts(t("go"),g);$("grp").value=g}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");
  render();renderSteps();renderTable();
}
function msg(id,text,ok){const m=$(id);m.textContent=text;m.className="msg "+(ok?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=+b.dataset.v;render()};
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;view=VIEW[k];render();renderSteps();if(allDone())msg("mx",t("alldone"),true)});
$("scene").addEventListener("click",e=>{const g=e.target.closest(".tb");if(!g||view!==1||!S.p1)return;ag.add(+g.dataset.k);render();renderSteps();if(allDone())msg("mx",t("alldone"),true)});
$("tbl").addEventListener("change",e=>{const el=e.target;if(el.dataset.r==null)return;tv[el.dataset.r+el.dataset.k]=el.value;el.classList.remove("ok","bad")});
$("chk6").onclick=()=>{const bad=[];AN.forEach((a,i)=>{let ok=true;["r","o","e"].forEach(k=>{const el=document.querySelector(`[data-r="${i}"][data-k="${k}"]`),g=el.value===a[k];el.className=g?"ok":"bad";if(!g)ok=false});if(!ok)bad.push(a.a)});
  const g=$("grp").value==="1";$("grp").className=g?"ok":"bad";if(!g)bad.push("?");
  d6=!bad.length;renderSteps();d6?msg("m6",t("ok6"),true):msg("m6",t("bad6")+bad.join(", ")+".",false)};
$("send").onclick=()=>{const f=["a1","a2"].every(id=>$(id).value.trim());msg("m7",f?t("sent"):t("empty"),f)};
applyLang();
}
</script>
<script src="../embed.js"></script>
</body>
</html>
