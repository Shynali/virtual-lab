:root{color-scheme:light dark;

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}

.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}

.sheet{background:var(--sheet);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:clamp(16px,2.6vw,30px)}
.note{font-size:13px;color:var(--mute);margin:0 0 10px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,36px);align-items:start}
.step{border-top:1px solid var(--line);padding:14px 0}
.step:first-child{border-top:0;padding-top:0}
.step.off{opacity:.45;pointer-events:none}
h2{font:700 19px/1.2 "Noto Serif",Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
textarea,select{font:16px "Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}

textarea{min-height:76px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}
@keyframes glow{50%{fill:#f97316}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}

.scroll{overflow-x:auto}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.brown{transition:opacity 2s ease}.pk{transition:fill 1.6s ease}.ca{transition:transform 4s ease-in-out,opacity 6s ease;transform-box:fill-box;transform-origin:center}.water{animation:fall2 .6s linear infinite}@keyframes fall2{from{transform:translateY(-10px);opacity:.9}to{transform:translateY(30px);opacity:.2}}.eq input{width:44px;padding:6px;text-align:center;font:600 16px "Noto Sans",Arial,sans-serif;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}

.tray small{width:100%;font-weight:700;color:var(--mute);font-size:13px;margin-top:4px}

function bub(x,W,y,n,dur){let s="";for(let k=0;k<n;k++){const cx=x+7+(k*11)%(W-14),d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y}" r="${1.6+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
function tube(x,lab,liq,lh,ex,top,TOP=100,BOT=300){const W=56;let h=`<clipPath id="c${x}${TOP}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x}${TOP})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${liq}"/>`;h+=(ex||"")+`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(lab)h+=`<text x="${x+W/2}" y="${BOT+24}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${lab}</text>`;if(top)h+=`<text x="${x+W/2}" y="${TOP-22}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">${top}</text>`;return h}
function lamp(cx,tip){return`<path class="flame" d="M${cx} ${tip}c-15 18-17 36-10 50h20c7-14 5-32-10-50z" fill="#f97316" opacity=".9"/><path class="flame" d="M${cx} ${tip+20}c-7 11-8 20-4 30h8c4-10 3-19-4-30z" fill="#fde047"/><rect x="${cx-3}" y="${tip+48}" width="6" height="10" fill="#57534e"/><path d="M${cx-34} ${tip+110}l8-48h52l8 48z" fill="rgba(200,228,242,.6)" stroke="var(--glassline)" stroke-width="2"/><rect x="${cx-10}" y="${tip+56}" width="20" height="8" rx="2" fill="#a8a29e"/>`}
function v1(){let h=`<rect x="40" y="380" width="300" height="12" rx="3" fill="#64748b"/><rect x="300" y="60" width="8" height="322" fill="#94a3b8"/><rect x="250" y="178" width="58" height="8" rx="3" fill="#94a3b8"/>`;
  h+=`<g transform="translate(110 250) rotate(-24)"><clipPath id="rt"><rect x="0" y="-20" width="190" height="40" rx="20"/><rect x="40" y="-20" width="150" height="40"/></clipPath><g clip-path="url(#rt)"><rect x="0" y="-20" width="190" height="40" fill="var(--glass)"/>`;
  if(S.salt)h+=`<rect x="0" y="-20" width="40" height="40" fill="#f1f5f9"/>`;for(let k=0;k<(S.salt?14:0);k++)h+=`<rect x="${4+(k*7)%30}" y="${-14+(k*9)%26}" width="5" height="5" fill="#fff" stroke="#cbd5e1"/>`;

  if(run)for(let k=0;k<8;k++)h+=`<circle class="bub" cx="${10+(k*8)%55}" cy="${-8+(k*7)%18}" r="2.4" fill="#fff" style="--d:.9s;--dl:${-k*.1}s;animation-name:rise2"/>`;
  h+=`</g><path d="M190 -20H20a20 20 0 0 0 0 40H190" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;if(S.cork)h+=`<rect x="186" y="-22" width="22" height="44" rx="4" fill="#3f3f46"/>`;h+=`</g>`;
  h+=tube(405,"CH₃COOH",col>0?CLR:null,col*40,run?`<circle class="bub" cx="433" cy="${300-col*40-6}" r="3" fill="#bfdbfe" style="--d:1.2s;--dl:0s;animation-name:fallD"/>`:"","",220,370);
  if(S.cork){const mx=110+197*Math.cos(-24*Math.PI/180),my=250+197*Math.sin(-24*Math.PI/180);h+=`<path d="M${mx} ${my}H433V320" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linejoin="round"/>`}

  h+=tube(250,"Zn",S.dil?CLR:null,80,S.zn?`<path d="M266 290q4-12 12-10q10-2 10 8q-2 9-12 8q-10 1-10-6z" fill="#94a3b8" stroke="#64748b"/>`+bub(250,56,284,5,2.4):"",S.zn?"H₂↑":"");
  const c=!S.naoh?null:drops>=4?CLR:drops>=2?"#f9a8d4":"#db2777";h+=tube(390,"NaOH",c,70+drops*4,"",drops?`CH₃COOH: ${drops}`:"");return h}
function v3(){let h=`<g transform="translate(0,-50)"><path d="M170 170v180q0 14 14 14h192q14 0 14-14V170" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.5"/><text x="400" y="360" font-size="12" fill="var(--mute)">${t("bathl")}</text>`;

  if(S.water)h+=`<text x="400" y="${330-lh+14}" font-size="13" font-weight="700" fill="#b45309">← ${t("ester")}</text>`;

function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);["st2","st3","st4"].forEach(s=>$(s).classList.toggle("off",!(g&&S.dil)));
  const ORD=["salt","acid","cork","heat","dil"],DEP={drop:"naoh",bath:"mix",water:"bath"};
