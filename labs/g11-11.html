const $=id=>document.getElementById(id),t=k=>T[lang][k];
const CLR="rgba(200,228,242,.55)",WH="#e2e8f0";
function tube(x,lab,liq,lh,ppt,ex,top,W=56){const TOP=100,BOT=300;let h=`<clipPath id="c${x}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${liq}"/>`;
  if(ppt)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" fill="${ppt}" opacity=".5"/><ellipse cx="${x+W/2}" cy="${BOT-12}" rx="${W/2-6}" ry="9" fill="${ppt}" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/>`;
  h+=(ex||"")+`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(lab)h+=`<text x="${x+W/2}" y="${BOT+22}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${lab}</text>`;
  if(top)h+=`<text x="${x+W/2}" y="${TOP-22}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">${top}</text>`;return h}
function flame(cx,tip){return`<path class="flame" d="M${cx} ${tip}c-14 16-16 32-9 44h18c7-12 5-28-9-44z" fill="#f97316" opacity=".9"/><path class="flame" d="M${cx} ${tip+18}c-6 10-7 18-4 26h8c3-8 2-16-4-26z" fill="#fde047"/><rect x="${cx-3}" y="${tip+42}" width="6" height="9" fill="#57534e"/><path d="M${cx-28} ${tip+92}l8-41h40l8 41z" fill="rgba(200,228,242,.6)" stroke="var(--glassline)" stroke-width="2"/>`}
function render(){let h="";
  if(view===1){[[150,"(NH₄)₂SO₄"],[350,"NH₄NO₃"]].forEach(([x,lab])=>{const cr=S.salts&&!S.naoh?[...Array(8)].map((_,k)=>`<rect x="${x+12+(k*6)%32}" y="${284-(k%3)*5}" width="6" height="6" fill="#fff" stroke="#cbd5e1"/>`).join(""):"";
      const gas=S.heat?[0,1,2].map(k=>`<circle class="smoke" cx="${x+28}" cy="80" r="${6+k*2}" fill="#e0e7ff" style="animation-delay:${-k*.8}s"/>`).join(""):"";
      h+=tube(x,(S.heat&&!S.lit)?"":lab,S.naoh?CLR:null,60,null,cr,"")+gas;
      if(S.lit){h+=`<rect x="${x+8}" y="52" width="40" height="22" rx="2" fill="${"#3b82f6"}" stroke="#1e3a8a"/><line x1="${x+48}" y1="62" x2="${x+80}" y2="42" stroke="#94a3b8" stroke-width="3"/>`}
      if(heating||S.heat&&!S.lit)h+=flame(x+28,304)});
    if(S.lit)h+=`<text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--acc)">NH₃↑ · ${t("lit")} → ${lang==="kk"?"көк":"синий"}</text>`}
  if(view===2){[["H₂SO₄",CLR],["Na₂SO₄",CLR],["CuSO₄","rgba(96,165,250,.6)"]].forEach(([lab,c],i)=>h+=tube(110+i*140,lab,S.sol?c:null,S.ba?95:75,S.ba?WH:null,"",S.ba?"BaSO₄↓":""))}
  $("scene").innerHTML=h;["v1","v2"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[["(NH₄)₂SO₄ + ",["k0","2"],"NaOH → Na₂SO₄ + ",["k1","2"],"NH₃↑ + ",["k2","2"],"H₂O"],[["k3","1"],"NH₄NO₃ + ",["k4","1"],"NaOH → NaNO₃ + NH₃↑ + H₂O"],["NH₄⁺ + OH⁻ → NH₃↑ + H₂O"],["H₂SO₄ + BaCl₂ → BaSO₄↓ + ",["k5","2"],"HCl"],["CuSO₄ + BaCl₂ → BaSO₄↓ + ",["k6","1"],"CuCl₂"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<small style="font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>`+E.map(e=>`<div class="eq">${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!g);
  const DEP={naoh:"salts",heat:"naoh",lit:"heat",ba:"sol"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,en=(!DEP[k]||S[DEP[k]])&&!heating;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st3").classList.toggle("off",!(S.lit&&S.ba));$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;view=["sol","ba"].includes(k)?2:1;
  if(k==="heat")msg("m1",t("heatm"),true);if(k==="lit")msg("m1",t("litm"),true);if(k==="ba")msg("m2",t("bam"),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),aa=el.dataset.a,g=v===aa||(aa==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
<script src="../embed.js"></script>
</body>
</html>
