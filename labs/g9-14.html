s4:"Вывод",q1:"Опиши явления, которые ты наблюдал в обоих опытах.",q2:"Сделай вывод: какой элемент входит в состав кости и яичной скорлупы? Для чего нужна зубная паста?",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопросы."}};
let lang="kk",ok=false,view=1;const S={bone:0,vin1:0,bend:0,paste:0,vin2:0};let days=0,hours=0,eggDone=false;const qv={},ev={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function bonePath(x1,y1,x2,y2,bend){const mx=(x1+x2)/2,my=(y1+y2)/2+bend;const d=`M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}`;
  const knob=(x,y)=>`<circle cx="${x-7}" cy="${y-7}" r="11"/><circle cx="${x+7}" cy="${y+7}" r="11"/>`;
  return`<g><path d="${d}" fill="none" stroke="#a8936a" stroke-width="20" stroke-linecap="round"/><g fill="#a8936a">${knob(x1,y1)}${knob(x2,y2)}</g><path d="${d}" fill="none" stroke="#f3ead2" stroke-width="15" stroke-linecap="round"/><g fill="#f3ead2" transform="translate(0,0)">${knob(x1,y1).replace(/r="11"/g,'r="8.5"')}${knob(x2,y2).replace(/r="11"/g,'r="8.5"')}</g></g>`}
function boneScene(){let h=`<text x="280" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${S.vin1?days+" "+t("day"):""}</text>`;
  const X=110,W=200,TOP=90,BOT=350;
  h+=`<rect x="${X}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="22" fill="var(--glass)" stroke="var(--glassline)" stroke-width="3"/><rect x="${X+10}" y="${TOP-18}" width="${W-20}" height="20" rx="6" fill="var(--glassline)" opacity=".7"/>`;
  if(S.vin1)h+=`<rect x="${X+3}" y="${TOP+60}" width="${W-6}" height="${BOT-TOP-63}" rx="18" style="fill:rgba(${240-days*3},${236-days*2},${200-days*6},.6)"/>`;
  if(S.bone&&!S.bend)h+=bonePath(X+40,BOT-40,X+W-40,TOP+100,0);
  if(S.vin1&&!S.bend)for(let k=0;k<5;k++)h+=`<circle class="bub" cx="${X+50+k*25}" cy="${BOT-60-(k%3)*30}" r="2.5" fill="#fff" stroke="#9fb7c7" style="--d:${3+k%3}s;--dl:${-k}s"/>`;
  if(S.bend){h+=bonePath(360,250,510,250,-120);h+=`<path d="M350 300q-20-40 0-80" fill="none" stroke="var(--acc)" stroke-width="3" marker-end="url(#ar)"/><path d="M520 300q20-40 0-80" fill="none" stroke="var(--acc)" stroke-width="3" marker-end="url(#ar)"/><text x="435" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="var(--acc)">${lang==="kk"?"иілді":"гнётся"}</text>`}
  return`<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--acc)"/></marker></defs>`+h}
function eggScene(){const X=150,W=260,TOP=80,BOT=360,cx=280,cy=255;let h=`<text x="280" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${S.vin2?hours+" "+t("hour"):""}</text>`;
  h+=`<path d="M${X} ${TOP}V${BOT-14}q0 14 14 14h${W-28}q14 0 14-14V${TOP}" fill="var(--glass)" stroke="var(--glassline)" stroke-width="3"/>`;
  if(S.vin2)h+=`<path d="M${X+2} ${TOP+50}V${BOT-14}q0 12 12 12h${W-28}q12 0 12-12V${TOP+50}z" fill="rgba(240,236,200,.55)"/>`;
  const shellOp=hours<12?1:Math.max(0,1-(hours-12)/24);
  h+=`<clipPath id="L"><rect x="0" y="0" width="${cx}" height="400"/></clipPath><clipPath id="R"><rect x="${cx}" y="0" width="300" height="400"/></clipPath>`;
  h+=`<ellipse cx="${cx}" cy="${cy}" rx="62" ry="80" fill="#fbf8f0" stroke="#d8d2c2" stroke-width="2"/>`;
  h+=`<g clip-path="url(#R)"><ellipse cx="${cx}" cy="${cy}" rx="62" ry="80" fill="#d9a877" opacity="${shellOp}"/></g>`;
  h+=`<g clip-path="url(#L)"><ellipse cx="${cx}" cy="${cy}" rx="62" ry="80" fill="#d9a877"/>${S.paste?`<ellipse cx="${cx}" cy="${cy}" rx="62" ry="80" fill="#e6f4f1" opacity=".92"/><path d="M${cx-50} ${cy-30}h40M${cx-56} ${cy}h46M${cx-50} ${cy+30}h40" stroke="#7dd3c0" stroke-width="4" stroke-linecap="round"/>`:""}</g>`;
  h+=`<line x1="${cx}" y1="${cy-80}" x2="${cx}" y2="${cy+80}" stroke="#b9a98a" stroke-dasharray="4 4" opacity="${S.paste?.8:0}"/>`;
  if(S.paste)h+=`<text x="${cx-30}" y="${cy-92}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--mute)">${t("paste")}</text>`;
  if(S.vin2&&hours>=2&&hours<40)for(let k=0;k<12;k++){const a=-1.2+k*0.22,bx=cx+62*Math.cos(a)*0.98,by=cy+80*Math.sin(a)*0.98;h+=`<circle class="ebub" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${2+k%3}" fill="#fff" stroke="#9fb7c7" style="--dl:${(-k*0.13).toFixed(2)}s"/>`}
  if(S.vin2&&hours>=2&&hours<40)h+=`<text x="${cx+110}" y="${cy-60}" font-size="16" font-weight="700" fill="var(--acc)">CO₂↑</text>`;
  return h}
function render(){$("scene").innerHTML=view===1?boneScene():eggScene();$("v1").classList.toggle("on",view===1);$("v2").classList.toggle("on",view===2)}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[["m",[["k0","1"],"CaCO₃ + ",["k1","2"],"CH₃COOH → ",["k2","1"],"(CH₃COO)₂Ca + H₂O + CO₂↑"]]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=E.map(([k,e])=>`<div class="eq"><small style="width:100%;font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!g);
  const DEP={vin1:"bone",bend:"vin1",vin2:"paste"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,done=!!S[k],en=!DEP[k]||S[DEP[k]];b.disabled=done||!en;b.classList.toggle("done",done)});
  $("days").disabled=!S.vin1||!!S.bend;$("hours").disabled=!S.vin2;$("dl").textContent=days+" "+t("day");$("hl").textContent=hours+" "+t("hour");
  $("st3").classList.toggle("off",!(S.bend&&eggDone));$("st4").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("v1").onclick=()=>{view=1;render()};$("v2").onclick=()=>{view=2;render()};
$("goggles").onchange=renderSteps;
$("days").oninput=e=>{days=+e.target.value;view=1;$("m1").textContent="";render();renderSteps()};
$("hours").oninput=e=>{hours=+e.target.value;view=2;msg("m2",hours>=36?t("h3"):hours>=12?t("h2"):hours>=2?t("h1"):t("h0"),true);if(hours>=48)eggDone=true;render();renderSteps()};
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;
  if(k==="bend"){view=1;if(days<7){msg("m1",t("stiff"),false);render();return}S.bend=1;msg("m1",t("bent"),true);render();renderSteps();return}
  S[k]=1;view=(k==="paste"||k==="vin2")?2:1;if(k==="vin2")msg("m2",t("h0"),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),a=el.dataset.a,g=v===a||(a==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
