s4:"Вопросы и уравнения",s4h:"Выбери ответ и расставь коэффициенты (если 1, поле можно оставить пустым).",
qs:[["На какой ион реактивом является комплексный ион [Fe(CN)₆]⁴⁻?",["—","Fe³⁺","Fe²⁺","Cu²⁺"],"1"],["На какой ион реактивом является комплексный ион [Fe(CN)₆]³⁻?",["—","Fe²⁺","Fe³⁺","Cu²⁺"],"1"],["Координационное число меди в комплексе [Cu(NH₃)₄]²⁺:",["—","4","2","6"],"1"],["Почему аммиачный комплекс разрушается при добавлении HCl?",["—","Молекулы NH₃ связываются с ионами H⁺ в NH₄⁺","Медь окисляется","Раствор охлаждается"],"1"],["Цвет раствора [Cu(NH₃)₄]²⁺:",["—","Интенсивно синий","Жёлтый","Бесцветный"],"1"]],
check:"Проверить",ok:"Всё верно! [Fe(CN)₆]⁴⁻ — реактив на Fe³⁺, [Fe(CN)₆]³⁻ — на Fe²⁺; медь с аммиаком образует интенсивно синий комплекс [Cu(NH₃)₄]²⁺.",bad:"Неверных ответов: ",
eqm:"Уравнения реакций:",
s5:"Вывод",q1:"На какие ионы железа являются реактивами комплексные ионы [Fe(CN)₆]³⁻ и [Fe(CN)₆]⁴⁻? Сделай вывод.",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопрос."}};
let lang="kk",ok=false,view=1;const S={cu:0,nh1:0,nh2:0,hcl:0,f3:0,f3a:0,f2:0,f2a:0};const qv={},ev={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function tube(x,lab,liq,lh,ppt,top,W=60){const TOP=100,BOT=300;let h=`<clipPath id="c${x}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${liq}"/>`;
  if(ppt)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" fill="${ppt}" opacity=".45"/><ellipse cx="${x+W/2}" cy="${BOT-12}" rx="${W/2-6}" ry="10" fill="${ppt}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>`;
  h+=`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(lab)h+=`<text x="${x+W/2}" y="${BOT+24}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${lab}</text>`;
  if(top)h+=`<text x="${x+W/2}" y="${TOP-22}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--acc)">${top}</text>`;return h}
function render(){let h="";
  if(view===1){let liq=null,lh=70,ppt=null,top="";if(S.cu){liq="rgba(125,185,240,.6)"}if(S.nh1){ppt="#93c5fd";top="Cu(OH)₂↓";lh=80}if(S.nh2){ppt=null;liq="#1e3a8a";top="[Cu(NH₃)₄]²⁺";lh=105}if(S.hcl){liq="rgba(125,185,240,.7)";top="Cu²⁺";lh=115}
    h+=tube(250,"CuSO₄",liq,lh,ppt,top)}
  if(view===2){let p3=S.f3a?"#9a3412":S.f3?"#1d4ed8":null,p2=S.f2a?"#57653a":S.f2?"#172554":null;
    h+=tube(150,"FeCl₃",S.f3&&!S.f3a?"rgba(37,99,235,.55)":"rgba(234,179,8,.45)",S.f3a?100:80,p3,S.f3a?"Fe(OH)₃↓":S.f3?(lang==="kk"?"берлин лазурі":"берлинская лазурь"):"")+tube(350,"FeSO₄",S.f2&&!S.f2a?"rgba(30,58,138,.6)":"rgba(190,230,190,.5)",S.f2a?100:80,p2,S.f2a?"Fe(OH)₂↓":S.f2?(lang==="kk"?"турнбул көгі":"турнбулева синь"):"")}
  $("scene").innerHTML=h;["v1","v2"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[["CuSO₄ + ",["k0","2"],"NH₃·H₂O → Cu(OH)₂↓ + (NH₄)₂SO₄"],["Cu(OH)₂ + ",["k1","4"],"NH₃ → [Cu(NH₃)₄](OH)₂"],[["k2","4"],"FeCl₃ + ",["k3","3"],"K₄[Fe(CN)₆] → Fe₄[Fe(CN)₆]₃↓ + ",["k4","12"],"KCl"],[["k5","3"],"FeSO₄ + ",["k6","2"],"K₃[Fe(CN)₆] → Fe₃[Fe(CN)₆]₂↓ + ",["k7","3"],"K₂SO₄"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<small style="font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>`+E.map(e=>`<div class="eq">${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;["st1","st2","st3"].forEach(s=>$(s).classList.toggle("off",!g));
  const DEP={nh1:"cu",nh2:"nh1",hcl:"nh2",f3a:"f3",f2a:"f2"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,en=!DEP[k]||S[DEP[k]];b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st4").classList.toggle("off",!(S.hcl&&S.f3a&&S.f2a));$("st5").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
$("goggles").onchange=renderSteps;
const MAP={nh1:["m1","nh1m"],nh2:["m1","nh2m"],hcl:["m1","hclm"],f3:["m2","f3m"],f3a:["m2","f3am"],f2:["m3","f2m"],f2a:["m3","f2am"]};
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;view=["cu","nh1","nh2","hcl"].includes(k)?1:2;if(MAP[k])msg(MAP[k][0],t(MAP[k][1]),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),aa=el.dataset.a,g=v===aa||(aa==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
