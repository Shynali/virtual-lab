const D={"A": [["N", 0.0, 0.253, 0.0], ["H", 0.91, -0.084, -0.281], ["H", -0.699, -0.084, -0.647], ["H", -0.211, -0.084, 0.929]], "AB": [[0, 1], [0, 2], [0, 3]], "LP": [0.0, 1.002, 0.0], "B": [["C", -0.273, 0.0, 0.0], ["H", 0.091, 1.028, 0.0], ["H", 0.091, -0.514, -0.89], ["H", 0.091, -0.514, 0.89]], "BB": [[0, 1], [0, 2], [0, 3]], "F": [-1.173, 0.0, 0.0], "M": [["N", -0.767, 0.428, 0.237], ["C", 0.557, -0.062, -0.172], ["H", -1.465, 0.091, -0.41], ["H", -0.978, 0.091, 1.166], ["H", 1.069, 0.71, -0.747], ["H", 0.44, -0.954, -0.787], ["H", 1.144, -0.305, 0.713]], "MB": [[0, 1], [0, 2], [0, 3], [1, 4], [1, 5], [1, 6]], "LPM": [-0.767, 1.178, 0.237]};
const NUM=["—","1","2","3","4","5"];
let lang="kk",ok=false,fA=false,fB=false,f3=false,view=1,rot=25;const qv={},sv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const ST={H:[13,"#f8fafc","#94a3b8","#111"],C:[20,"#1f2937","#000","#fff"],N:[20,"#2563eb","#1e3a8a","#fff"]};
function draw(atoms,bonds,S,opt={}){const a=(rot+(opt.ro||0))*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),tl=0.35,ct=Math.cos(tl),st=Math.sin(tl);
  const P=([x,y0,z0])=>{const rx=opt.rx||0,y=y0*Math.cos(rx)-z0*Math.sin(rx),z=y0*Math.sin(rx)+z0*Math.cos(rx);const x1=x*ca+z*sa,z1=-x*sa+z*ca,y1=y*ct-z1*st,z2=y*st+z1*ct;return[280+x1*S,200-y1*S,z2]};
  const pr=atoms.map(at=>P(at.slice(1)));let items=[];
  bonds.forEach(([i,j])=>items.push([Math.min(pr[i][2],pr[j][2])-.01,`<line x1="${pr[i][0].toFixed(1)}" y1="${pr[i][1].toFixed(1)}" x2="${pr[j][0].toFixed(1)}" y2="${pr[j][1].toFixed(1)}" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>`]));
  if(opt.free){const f=P(opt.free);items.push([Math.min(f[2],pr[0][2])-.01,`<line x1="${pr[0][0].toFixed(1)}" y1="${pr[0][1].toFixed(1)}" x2="${f[0].toFixed(1)}" y2="${f[1].toFixed(1)}" stroke="#9ca3af" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 0"/><circle cx="${f[0].toFixed(1)}" cy="${f[1].toFixed(1)}" r="5" fill="#9ca3af"/>`])}
  if(opt.lp){const n=atoms[0],lv=[1,2,3].map(k=>n[k]+(opt.lp[k-1]-n[k])*0.62),l=P(lv);items.push([l[2]-.02,`<ellipse cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" rx="14" ry="22" fill="#93c5fd" opacity=".55"/><circle cx="${(l[0]-5).toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.5" fill="#1e3a8a"/><circle cx="${(l[0]+5).toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.5" fill="#1e3a8a"/>`])}
  atoms.forEach((at,i)=>{const e=at[0],[r0,f,s,tc]=ST[e],z=pr[i][2],r=r0*(1+z*.08),cx=pr[i][0].toFixed(1),cy=pr[i][1].toFixed(1);
    const g=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${f}" stroke="${s}" stroke-width="2"/><circle cx="${(pr[i][0]-r*.35).toFixed(1)}" cy="${(pr[i][1]-r*.35).toFixed(1)}" r="${(r*.28).toFixed(1)}" fill="#fff" opacity=".4"/><text x="${cx}" y="${(pr[i][1]+r*.33).toFixed(1)}" text-anchor="middle" font-size="${(r*.85).toFixed(0)}" font-weight="700" fill="${tc}" pointer-events="none">${e}</text>`;
    items.push([z,opt.click&&e==="H"?`<g class="hpick" data-h="${i}" tabindex="0" role="button" aria-label="H">${g}</g>`:`<g>${g}</g>`])});
  items.sort((p,q)=>p[0]-q[0]);return items.map(x=>x[1]).join("")}
function render(){let h="";const ttl=s=>`<text x="40" y="34" font-size="17" font-weight="700" fill="var(--ink)">${s}</text>`;
  if(view===1){h+=ttl("NH₃");h+=fA?draw(D.A,D.AB,110,{lp:D.LP}):`<text x="280" y="200" text-anchor="middle" fill="var(--mute)">?</text>`}
  if(view===2){h+=ttl("–CH₃");h+=fB?draw(D.B,D.BB,110,{free:D.F,ro:-5,rx:0.9}):`<text x="280" y="200" text-anchor="middle" fill="var(--mute)">?</text>`}
  if(view===3){if(f3){h+=ttl("CH₃–NH₂");h+=draw(D.M,D.MB,95,{lp:D.LPM})}else if(fB){h+=ttl("NH₃ → CH₃NH₂");h+=draw(D.A,D.AB,110,{lp:D.LP,click:true})+`<text x="280" y="385" text-anchor="middle" font-size="13" fill="var(--mute)">${t("tap")}</text>`}}
  $("scene").innerHTML=h;["v1","v2","v3"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){["a_n","a_h","b_c","b_h"].forEach(id=>$(id).innerHTML=opts(NUM,sv[id]));
  $("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("")}
function renderSteps(){$("st2").classList.toggle("off",!fA);$("st3").classList.toggle("off",!fB);$("st4").classList.toggle("off",!f3);$("st5").classList.toggle("off",!ok);
  [["bA",fA],["bB",fB]].forEach(([b,f])=>{$(b).disabled=f;$(b).classList.toggle("done",f)})}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2,3].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
document.querySelectorAll("#st1 select,#st2 select").forEach(s=>s.onchange=()=>{sv[s.id]=s.value;s.className=""});
function chkSet(A){let bad=0;for(const k in A){const g=$(k).value===A[k];$(k).className=g?"ok":"bad";if(!g)bad++}return!bad}
$("bA").onclick=()=>{view=1;fA=chkSet({a_n:"1",a_h:"3"});fA?msg("m1",t("okA"),true):msg("m1",t("badA"),false);render();renderSteps()};
$("bB").onclick=()=>{view=2;fB=chkSet({b_c:"1",b_h:"3"});fB?msg("m2",t("okB"),true):msg("m2",t("badB"),false);render();renderSteps()};
function pick(){if(f3||!fB)return;f3=true;view=3;msg("m3",t("ok3"),true);render();renderSteps()}
$("scene").addEventListener("click",e=>{if(e.target.closest("[data-h]"))pick()});
$("scene").addEventListener("keydown",e=>{if(e.target.closest("[data-h]")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick()}});
$("rot").oninput=e=>{rot=+e.target.value;render()};
document.querySelector("#qs").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim()&&$("a2").value.trim();msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
