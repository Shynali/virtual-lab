<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ерітінділердің ортасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm school lab workbook, clear and encouraging (grade 7)
   IDEA: a workbench sheet — a three-by-three rack: three solutions, three indicators
   PICTURE: nine tubes taking on indicator colours (crimson, red, orange, yellow, violet, blue) as each is tested
   COLOUR and TYPE: white sheet on deep lab-teal; the indicator colours themselves; Noto Serif + Noto Sans
   LAYOUT: steps left, scene right (sticky) with view switch; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#0f4c5c,#0a2d36);--sheet:light-dark(#ffffff,#13202a);--ink:light-dark(#10131a,#e7edf2);
--mute:light-dark(#566170,#9fb0bf);--line:light-dark(#d5dde5,#2b3d4b);--soft:light-dark(#eef5f7,#182a35);
--acc:light-dark(#0f4c5c,#5cc2d6);--ok:light-dark(#12733a,#4ade80);--bad:light-dark(#b91c1c,#f87171);
--warn:light-dark(#fff4d6,#3a2f12);--glass:light-dark(#f7fbfd,#1d2f3b);--glassline:light-dark(#8aa1b1,#6c8597)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(3vw,12px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:18px}
header small{display:block;opacity:.8;font-size:14px}
h1{font:700 clamp(24px,3.6vw,38px)/1.08 "Noto Serif",Georgia,serif;margin:2px 0 0;text-wrap:balance;max-width:26ch}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#fff;font:600 15px "Noto Sans";padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button.on{background:#fff;color:#0f4c5c}
.sheet{background:var(--sheet);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:clamp(16px,2.6vw,30px)}
.note{font-size:13px;color:var(--mute);margin:0 0 10px}
.goal{margin:0 0 6px;max-width:70ch}
.reag{margin:0 0 16px;color:var(--mute);font-size:15px;max-width:70ch}
.safety{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.safety p{margin:0;flex:1 1 260px;font-weight:600}
.safety label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,36px);align-items:start}
.step{border-top:1px solid var(--line);padding:14px 0}
.step:first-child{border-top:0;padding-top:0}
.step.off{opacity:.45;pointer-events:none}
h2{font:700 19px/1.2 "Noto Serif",Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
textarea,select{font:16px "Noto Sans";color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
textarea{min-height:76px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans";cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.board{position:sticky;top:12px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans";padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.rackbox{background:var(--soft);border-radius:16px;padding:10px}
.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}
@keyframes glow{50%{fill:#f97316}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
@media(prefers-reduced-motion:reduce){.mag{transition:none}.glow,.flame{animation:none}}
.scroll{overflow-x:auto}
.fill{transition:fill 1.4s ease}.tb{cursor:pointer}.tb:hover .gl{stroke:var(--acc)}
.bub{animation:rise var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.95}100%{transform:translateY(-80px);opacity:0}}
.smoke{animation:smoke 2.6s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.6}100%{transform:translateY(-70px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.bub,.smoke{animation:none;opacity:.6}}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;font-size:14px;width:130px}
td select{padding:6px;font-size:13px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px "Noto Sans";margin-bottom:10px}
.eq select{width:auto;padding:6px 8px;font:600 15px "Noto Sans"}
.q{margin-bottom:10px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.board{position:static;order:-1}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><small data-i="lab"></small><h1 data-i="title"></h1></div>
  <div class="lang" role="group" aria-label="Тіл"><button id="l-kk" class="on">Қазақша</button><button id="l-ru">Русский</button></div>
</header>
<div class="sheet">
  <p class="note" data-i="demo"></p>
  <p class="goal" data-i="goal"></p>
  <p class="reag" data-i="reag"></p>
  <div class="safety">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3 32 30H2Z" fill="#f59e0b"/><rect x="15.5" y="11" width="3" height="11" rx="1.5" fill="#fff"/><circle cx="17" cy="26" r="1.8" fill="#fff"/></svg>
    <p data-i="safe"></p>
    <label><input type="checkbox" id="goggles" style="width:22px;height:22px"><span data-i="safeok"></span></label>
  </div>
  <div class="grid">
    <div>
      <section class="step" id="st1"><h2 data-i="s1"></h2><p class="hint" data-i="s1h"></p>
        <ol style="margin:0;padding-left:20px;font-size:15px" id="tasks"></ol>
        <div class="msg" id="m1" aria-live="polite"></div></section>
      <section class="step" id="st2"><h2 data-i="s2"></h2><p class="hint" data-i="s2h"></p>
        <div class="scroll"><table><thead><tr><th data-i="cind"></th><th data-i="ca"></th><th data-i="cn"></th><th data-i="cb"></th></tr></thead><tbody id="tbl"></tbody></table></div>
        <div class="btns"><button class="btn" id="chk2" data-i="check"></button></div>
        <div class="msg" id="m2" aria-live="polite"></div></section>
      <section class="step" id="st3"><h2 data-i="s3"></h2>
        <label><span data-i="qa"></span><select id="qa"></select></label>
        <div class="btns"><button class="btn" id="chk3" data-i="check"></button></div>
        <div class="msg" id="m3" aria-live="polite"></div></section>
      <section class="step" id="st4"><h2 data-i="s4"></h2>
        <div class="q"><label><span data-i="q1"></span><textarea id="a1"></textarea></label></div>
        <div class="q"><label><span data-i="q2"></span><textarea id="a2"></textarea></label></div>
        <div class="btns"><button class="btn" id="send" data-i="send"></button></div>
        <div class="msg" id="m4" aria-live="polite"></div></section>
    </div>
    <div class="board"><div class="rackbox"><svg id="scene" viewBox="0 0 560 480" aria-label="rack"></svg></div></div>
  </div>
</div>
</div>
<script>
{
const T={
kk:{lab:"7-сынып · 7-зертханалық жұмыс",title:"Ерітінділердің қышқылдық және сілтілік ортасын зерттеу",demo:"Үлгі нұсқа: тіркелу және жұмысты мұғалімге жіберу толық сайтта қосылады.",
goal:"Мақсаты: индикаторлардың көмегімен ерітінділердің қышқылдық, бейтарап және сілтілік ортасын анықтау.",
reag:"Реактивтер: натрий гидроксиді, тұз қышқылы, ас тұзы ерітінділері, фенолфталеин, метилоранж, лакмус ерітінділері. Құрал-жабдықтар: сынауық, сынауыққа арналған тұрғы.",
safe:"Қышқыл және сілті ерітінділерімен жұмыс жасау ережелерін сақта: қорғау көзілдірігін ки.",safeok:"Ережені оқыдым",
s1:"1-қадам. Индикаторларды тамыз",s1h:"Оң жақтағы сынауықты бас: оған 2 мл ерітінді құйылып, 1–2 тамшы индикатор тамызылады. Тоғыз сынауықтың бәрін тексер.",
tasks:["2 мл натрий гидроксидіне фенолфталеин, сосын метилоранж және лакмус тамыз.","2 мл тұз қышқылына метилоранж, сосын фенолфталеин және лакмус тамыз.","2 мл ас тұзы ерітіндісіне индикаторларды тамыз."],
alldone:"Тоғыз сынауық та тексерілді. Кестені толтыр.",
s2:"2-қадам. Кестені толтыр",s2h:"Әр ортадағы индикатордың түсін таңда.",cind:"Индикатордың атауы",ca:"Қышқылдық орта",cn:"Бейтарап орта",cb:"Сілтілік орта",
ind:["Фенолфталеин","Метилоранж","Лакмус"],col:["—","Түссіз","Таңқурай","Қызғылт-қызыл","Қызғылт сары","Сары","Қызыл","Күлгін","Көк"],
check:"Тексеру",ok2:"Кесте дұрыс толтырылды!",bad2:"Қате ұяшықтар саны: ",
s3:"3-қадам. Ойлан",qa:"Қай индикатор қышқылдық ортаны бейтарап ортадан ажырата алмайды?",ok3:"Дұрыс! Фенолфталеин қышқылдық ортада да, бейтарап ортада да түссіз.",bad3:"Кестеге тағы бір қара.",
s4:"4-қадам. Қорытынды",q1:"Индикатор түсінің өзгеруін түсіндір.",q2:"Қорытынды",
send:"Мұғалімге жіберу",sent:"Үлгіде жіберу әлі жұмыс істемейді. Толық сайтта жұмыс мұғалімнің бетіне түседі.",empty:"Алдымен барлық сұраққа жауап бер.",
rows:["HCl","NaCl","NaOH"],cols:["ф/ф","м/о","лакмус"],med:["қышқыл","бейтарап","сілті"],tap:"бас"},
ru:{lab:"7 класс · Лабораторная работа №7",title:"Исследование кислотной и щелочной среды растворов",demo:"Демо-версия: регистрация и отправка работы учителю появятся в полной версии сайта.",
goal:"Цель: определить с помощью индикаторов кислотную, нейтральную и щелочную среду растворов.",
reag:"Реактивы: растворы гидроксида натрия, соляной кислоты, поваренной соли, растворы фенолфталеина, метилоранжа, лакмуса. Оборудование: пробирки, штатив для пробирок.",
safe:"Соблюдай правила работы с растворами кислот и щелочей: надень защитные очки.",safeok:"Правила прочитаны",
s1:"Шаг 1. Добавь индикаторы",s1h:"Нажми на пробирку справа: в неё нальётся 2 мл раствора и добавится 1–2 капли индикатора. Проверь все девять пробирок.",
tasks:["К 2 мл гидроксида натрия добавь фенолфталеин, затем метилоранж и лакмус.","К 2 мл соляной кислоты добавь метилоранж, затем фенолфталеин и лакмус.","К 2 мл раствора поваренной соли добавь индикаторы."],
alldone:"Все девять пробирок проверены. Заполни таблицу.",
s2:"Шаг 2. Заполни таблицу",s2h:"Выбери цвет индикатора в каждой среде.",cind:"Название индикатора",ca:"Кислотная среда",cn:"Нейтральная среда",cb:"Щелочная среда",
ind:["Фенолфталеин","Метилоранж","Лакмус"],col:["—","Бесцветный","Малиновый","Розово-красный","Оранжевый","Жёлтый","Красный","Фиолетовый","Синий"],
check:"Проверить",ok2:"Таблица заполнена верно!",bad2:"Неверных ячеек: ",
s3:"Шаг 3. Подумай",qa:"Какой индикатор не может отличить кислотную среду от нейтральной?",ok3:"Верно! Фенолфталеин бесцветен и в кислотной, и в нейтральной среде.",bad3:"Посмотри на таблицу ещё раз.",
s4:"Шаг 4. Вывод",q1:"Объясни изменение цвета индикатора.",q2:"Вывод",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на все вопросы.",
rows:["HCl","NaCl","NaOH"],cols:["ф/ф","м/о","лакмус"],med:["кислота","нейтр.","щёлочь"],tap:"нажми"}};
// colours [row=medium acid,neutral,base][col=indicator]
const C=[["rgba(225,235,242,.55)","rgba(244,63,94,.65)","rgba(220,38,38,.6)"],["rgba(225,235,242,.55)","rgba(249,115,22,.6)","rgba(139,92,246,.6)"],["rgba(219,39,119,.65)","rgba(250,204,21,.65)","rgba(37,99,235,.6)"]];
// answers [indicator][medium] -> option index in col list
const ANS=[[1,1,2],[3,4,5],[6,7,8]];
let lang="kk";const done=Array(9).fill(0);let d2=false,d3=false;const tv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const X0=150,DX=135,Y0=70,DY=135,W=36,TH=100;
function render(){
  let h="";
  t("cols").forEach((c,j)=>h+=`<text x="${X0+j*DX+W/2}" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${c}</text>`);
  t("rows").forEach((r,i)=>{const y=Y0+i*DY;h+=`<text x="20" y="${y+60}" font-size="16" font-weight="700" fill="var(--ink)">${r}</text><text x="20" y="${y+80}" font-size="12" fill="var(--mute)">${t("med")[i]}</text>`;
    h+=`<rect x="${X0-30}" y="${y+60}" width="${2*DX+W+60}" height="8" rx="3" style="fill:light-dark(#b7c4cd,#3a4b57)" opacity=".7"/>`;
    for(let j=0;j<3;j++){const k=i*3+j,x=X0+j*DX,TOP=y+8,BOT=y+8+TH;
      h+=`<g class="tb" data-k="${k}"><clipPath id="c${k}"><rect x="${x}" y="${TOP}" width="${W}" height="${TH}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${TH/2}"/></clipPath><g clip-path="url(#c${k})"><rect x="${x}" y="${TOP}" width="${W}" height="${TH}" fill="var(--glass)"/>`;
      if(done[k])h+=`<rect class="fill" id="f${k}" x="${x}" y="${BOT-45}" width="${W}" height="45" fill="${done[k]===2?C[i][j]:"rgba(225,235,242,.55)"}" data-to="${C[i][j]}"/>`;
      h+=`</g><path class="gl" d="M${x} ${TOP-6}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-6}" fill="none" stroke="var(--glassline)" stroke-width="2"/>`;
      if(!done[k])h+=`<text x="${x+W/2}" y="${TOP+34}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--acc)">${t("tap")}</text>`;
      h+=`</g>`}});
  $("scene").innerHTML=h;
}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",done.some(x=>x<2));$("st3").classList.toggle("off",!d2);$("st4").classList.toggle("off",!d3);
  $("tasks").innerHTML=t("tasks").map((s,i)=>{const row=[2,0,1][i],ok=[0,1,2].every(j=>done[row*3+j]===2);return`<li style="${ok?"color:var(--ok)":""}">${s}</li>`}).join("")}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderTable(){$("tbl").innerHTML=t("ind").map((n,r)=>`<tr><td>${n}</td>${[0,1,2].map(c=>`<td><select data-r="${r}" data-c="${c}">${opts(t("col"),tv[r+"_"+c])}</select></td>`).join("")}</tr>`).join("");
  const v=$("qa").value;$("qa").innerHTML=opts(["—",...t("ind")],v);$("qa").value=v}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");
  render();renderSteps();renderTable();
}
function msg(id,text,ok){const m=$(id);m.textContent=text;m.className="msg "+(ok?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
$("scene").addEventListener("click",e=>{const g=e.target.closest(".tb");if(!g||!$("goggles").checked)return;const k=+g.dataset.k;if(done[k])return;done[k]=1;render();
  setTimeout(()=>{const f=$("f"+k);if(f)f.setAttribute("fill",f.dataset.to);done[k]=2;setTimeout(()=>{renderSteps();if(done.every(x=>x===2))msg("m1",t("alldone"),true)},1400)},350)});
$("tbl").addEventListener("change",e=>{const el=e.target;if(el.dataset.r==null)return;tv[el.dataset.r+"_"+el.dataset.c]=el.value;el.classList.remove("ok","bad")});
$("chk2").onclick=()=>{let bad=0;document.querySelectorAll("#tbl select").forEach(s=>{const ok=s.value===String(ANS[s.dataset.r][s.dataset.c]);s.classList.toggle("ok",ok);s.classList.toggle("bad",!ok);if(!ok)bad++});
  d2=!bad;renderSteps();d2?msg("m2",t("ok2"),true):msg("m2",t("bad2")+bad+".",false)};
$("chk3").onclick=()=>{const ok=$("qa").value==="1";$("qa").className=ok?"ok":"bad";d3=ok;renderSteps();ok?msg("m3",t("ok3"),true):msg("m3",t("bad3"),false)};
$("send").onclick=()=>{const f=["a1","a2"].every(id=>$(id).value.trim());msg("m4",f?t("sent"):t("empty"),f)};
applyLang();
}
</script>
<script src="../embed.js"></script>
</body>
</html>
