:root{color-scheme:light dark;

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}

.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px "Noto Sans",Arial,sans-serif;cursor:pointer;min-height:44px;background:var(--acc);color:light-dark(#fff,#08202a)}
.btn.done{background:var(--soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.done:disabled{opacity:1}
.msg{margin-top:8px;font-size:15px;min-height:1.4em}

.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:600 14px "Noto Sans",Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.4;cursor:default}

.rackbox svg{display:block;width:100%;height:auto}
.mag{transition:transform 1.2s ease}
.glow{animation:glow 1.4s ease-in-out 2;transform-box:fill-box}

check:"Проверить",ok:"Всё верно! По принципу Ле Шателье равновесие смещается в сторону ослабления внешнего воздействия.",bad:"Неверных ответов: ",
s3:"Вывод",q1:"По результатам опытов сделай вывод о смещении равновесия (принцип Ле Шателье).",
send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на вопрос.",cold:"холодная вода"}};
let lang="kk",view=1,ok=false;const S={ac:0,ph:0,nh:0,cl:0};let temp="room",cycle=0;const qv={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const PINK=a=>`rgba(219,39,119,${a})`,CLEAR="rgba(225,235,242,.6)";
function tube(x,W,TOP,BOT,liq,col,id,label,sub){let h=`<clipPath id="c${x}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect class="pk" id="${id}" x="${x}" y="${BOT-liq}" width="${W}" height="${liq}" fill="${col}"/>`;
  h+=`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/><rect x="${x-5}" y="${TOP-12}" width="${W+10}" height="7" rx="3" fill="var(--glassline)"/>`;
  return h+`<text x="${x+W/2}" y="${BOT+66}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${label}</text>`+(sub?`<text x="${x+W/2}" y="${BOT+84}" text-anchor="middle" font-size="12" fill="var(--mute)">${sub}</text>`:"")}
let prevCol={};
function setCol(id,col){const r=$(id);if(!r)return;const from=prevCol[id]||col;r.setAttribute("fill",from);requestAnimationFrame(()=>requestAnimationFrame(()=>r.setAttribute("fill",col)));prevCol[id]=col}
function c1(){if(!S.ph)return CLEAR;return temp==="hot"?PINK(.6):temp==="cold"?PINK(.05):PINK(.08)}
function render(){
  let h="";
  if(view===1){const x=240,W=70;h+=tube(x,W,90,300,S.ac?90:0,prevCol.t1||c1(),"t1","CH₃COONa",S.ph?"+ ф/ф":"");
    if(temp==="hot")h+=`<path class="flame" d="M${x+W/2-9} 344Q${x+W/2-12} 324 ${x+W/2} 304Q${x+W/2+12} 324 ${x+W/2+9} 344Z" fill="#fb923c"/>`;
    if(temp==="cold"){h+=`<rect x="${x+W-6}" y="60" width="60" height="18" rx="4" fill="#94a3b8"/>`;for(let k=0;k<22;k++)h+=`<rect class="water" x="${x+W+2+(k%2)*4}" y="${84+k*10}" width="3" height="12" rx="1.5" fill="#60a5fa" style="animation-delay:${-k*0.07}s"/>`;h+=`<text x="${x+W+60}" y="74" font-size="12" fill="var(--mute)">${t("cold")}</text>`}}
  else{[0,1].forEach(i=>{const x=[150,330][i],W=64,col=!S.nh?CLEAR:(i&&S.cl?PINK(.12):PINK(.55));h+=tube(x,W,90,300,S.nh?80:0,prevCol["n"+i]||col,"n"+i,i?"2":"1",S.nh?(i&&S.cl?"NH₄OH + NH₄Cl":"NH₄OH"):"");
    if(i&&S.cl)h+=Array.from({length:8},(_,k)=>`<rect x="${x+12+(k*9)%40}" y="${294-(k%3)*4}" width="4" height="4" fill="#fff" stroke="#cbd5e1" stroke-width=".6"/>`).join("")})}
  $("scene").innerHTML=h;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",+b.dataset.v===view));
}
function update(){render();if(view===1)setCol("t1",c1());else{setCol("n0",S.nh?PINK(.55):CLEAR);setCol("n1",!S.nh?CLEAR:(S.cl?PINK(.12):PINK(.55)))}}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function renderQ(){["q1","q2"].forEach((id,g)=>{$(id).innerHTML=t("qs"+(g+1)).map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${g}_${i}">${opts(q[1],qv[g+"_"+i])}</select></label>`).join("")})}
function renderSteps(){const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!g);
  const DEP={ph:"ac",cl:"nh"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,done=!!S[k],en=!DEP[k]||S[DEP[k]];b.disabled=done||!en;b.classList.toggle("done",done)});
  $("heat").disabled=!S.ph||temp==="hot"||cycle>=2;$("cool").disabled=temp!=="hot"||cycle>=2;
  const d1=cycle>=2,d2=!!S.cl;document.querySelectorAll("#q1 select").forEach(s=>s.disabled=!d1);document.querySelectorAll("#q2 select").forEach(s=>s.disabled=!d2);$("chk").disabled=!(d1&&d2);$("st3").classList.toggle("off",!ok)}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");
  render();renderQ();renderSteps();
}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=+b.dataset.v;render()};
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;view=["ac","ph"].includes(k)?1:2;update();renderSteps();
  if(k==="ph")msg("m1",t("m0"),true);if(k==="nh")msg("m2",t("n1"),true);if(k==="cl")msg("m2",t("n2"),true)});
$("heat").onclick=()=>{view=1;const again=temp==="cold";temp="hot";if(again)cycle=2;update();renderSteps();msg("m1",again?t("mh2"):t("mh"),true)};
$("cool").onclick=()=>{view=1;temp="cold";cycle=Math.max(cycle,1);update();renderSteps();msg("m1",t("mc"),true)};
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const[g,i]=s.dataset.q.split("_").map(Number),want=t("qs"+(g+1))[i][2],g2=s.value===want;s.className=g2?"ok":"bad";if(!g2)bad++});
  ok=!bad;renderSteps();ok?msg("m3",t("ok"),true):msg("m3",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=$("a1").value.trim();msg("m4",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
