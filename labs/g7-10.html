const $=id=>document.getElementById(id),t=k=>T[lang][k];
function bub(x,y,n,dur,h){let s="";for(let k=0;k<n;k++){const cx=x+(k*11)%30-15,d=(dur*(.8+(k%5)/10)).toFixed(2);s+=`<circle class="bub" cx="${cx}" cy="${y}" r="${1.8+(k%3)}" fill="#fff" stroke="#9fb7c7" style="--d:${d}s;--dl:${(-k*dur/n).toFixed(2)}s"/>`}return s}
function sound(loud){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),len=loud?0.35:0.12,buf=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,loud?2:4);const s=c.createBufferSource(),g=c.createGain();g.gain.value=loud?0.9:0.25;s.buffer=buf;s.connect(g).connect(c.destination);s.start()}catch(e){}}
function render(){
  let h="";
  if(!S.build){h+=`<text x="280" y="210" text-anchor="middle" font-size="15" fill="var(--mute)">…</text>`;$("scene").innerHTML=h;return}
  // left stand + generator tube
  h+=`<rect x="40" y="390" width="150" height="10" rx="3" fill="#6b7280"/><rect x="56" y="70" width="8" height="320" fill="#6b7280"/><rect x="60" y="210" width="60" height="6" fill="#6b7280"/><rect x="104" y="204" width="22" height="18" rx="3" fill="#374151"/>`;
  const x=110,W=44,TOP=150,BOT=360;
  h+=`<clipPath id="g1"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#g1)"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(S.acid)h+=`<rect x="${x}" y="${BOT-80}" width="${W}" height="80" fill="rgba(200,228,242,.55)"/>`;
  if(S.zn)h+=`<ellipse cx="${x+14}" cy="${BOT-14}" rx="9" ry="7" fill="#9aa6b2" stroke="#6b7785"/><ellipse cx="${x+30}" cy="${BOT-12}" rx="9" ry="7" fill="#9aa6b2" stroke="#6b7785"/>`;
  if(S.zn&&S.acid)h+=bub(x+W/2,BOT-24,14,1.2);
  h+=`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(S.cork)h+=`<path d="M${x-2} ${TOP-24}H${x+W+2}L${x+W-2} ${TOP+4}H${x+2}Z" fill="#7c5a3c"/>`;
  // delivery tube
  const tx=x+W/2;
  if(S.cork)h+=`<path d="M${tx} ${TOP+4}V100H350V340H400V${S.coll?190:320}" fill="none" stroke="light-dark(#9fb7c7,#6c8597)" stroke-width="5"/>`;
  else h+=`<path d="M${tx+60} 120H400" fill="none" stroke="light-dark(#9fb7c7,#6c8597)" stroke-width="5" opacity=".5"/>`;
  if(S.seal&&!S.zn&&S.cork)h+=bub(400,316,6,1.4);
  // right stand + collecting tube (inverted)
  h+=`<rect x="420" y="390" width="120" height="10" rx="3" fill="#6b7280"/><rect x="500" y="70" width="8" height="320" fill="#6b7280"/><rect x="440" y="150" width="62" height="6" fill="#6b7280"/>`;
  if(S.coll&&testing===null){const cx=400,CW=40,CT=110,CB=300;
    h+=`<clipPath id="g2"><rect x="${cx-CW/2}" y="${CT}" width="${CW}" height="${CB-CT}" rx="${CW/2}"/><rect x="${cx-CW/2}" y="${CT+(CB-CT)/2}" width="${CW}" height="${(CB-CT)/2}"/></clipPath><g clip-path="url(#g2)"><rect x="${cx-CW/2}" y="${CT}" width="${CW}" height="${CB-CT}" fill="var(--glass)"/>`;
    h+=`<rect class="gas" id="gas" x="${cx-CW/2}" y="${CT}" width="${CW}" height="${(CB-CT)*fill/100}" fill="rgba(186,230,253,.55)"/></g>`;
    h+=`<path d="M${cx-CW/2} ${CB+6}V${CT+CW/2}a${CW/2} ${CW/2} 0 0 1 ${CW} 0V${CB+6}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/><rect x="${cx+CW/2-2}" y="146" width="44" height="14" rx="3" fill="#374151"/>`;
    h+=`<text x="${cx}" y="${CT-10}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--acc)">H₂ ${fill}%</text>`}
  if(S.zn&&S.acid&&S.cork&&S.coll&&testing===null&&fill<100)h+=bub(400,200,8,1.2);
  // lamp + test
  if(S.lamp){const lx=300;h+=`<path class="flame" d="M${lx-9} 350Q${lx-12} 326 ${lx} 302Q${lx+12} 326 ${lx+9} 350Z" fill="#fb923c"/><path d="M${lx-26} 384Q${lx-28} 356 ${lx} 352Q${lx+28} 356 ${lx+26} 384Z" style="fill:light-dark(#dbe7ee,#2b3f4c)" stroke="var(--glassline)" stroke-width="2"/>`;
    if(testing!==null){const cx=lx+6,CT=170,CB=300,CW=40;h+=`<g transform="rotate(-25 ${cx} ${CB})"><path d="M${cx-CW/2} ${CB}V${CT+CW/2}a${CW/2} ${CW/2} 0 0 1 ${CW} 0V${CB}" fill="var(--glass)" stroke="var(--glassline)" stroke-width="2.4"/></g>`;
      h+=`<circle class="flash" cx="${lx}" cy="300" r="${testing==="loud"?60:22}" fill="${testing==="loud"?"#f97316":"#fde68a"}"/>`;
      h+=`<text x="${lx}" y="140" text-anchor="middle" font-size="${testing==="loud"?28:18}" font-weight="700" fill="${testing==="loud"?"#ea580c":"var(--acc)"}">${testing==="loud"?(lang==="kk"?"ШАҚ!":"ГАВ!"):(lang==="kk"?"пық":"пах")}</text>`}}
  $("scene").innerHTML=h;
}
const DEP={seal:"build",zn:"seal",acid:"zn",cork:"acid",coll:"cork",lamp:"coll"};
function renderSteps(){
  const g=$("goggles").checked;$("st1").classList.toggle("off",!g);$("st2").classList.toggle("off",!S.seal);$("st3").classList.toggle("off",!S.coll);
  document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,done=!!S[k],en=!DEP[k]||S[DEP[k]];b.disabled=done||!en;b.classList.toggle("done",done)});
  $("wait").textContent=t("bwait")+(S.coll?` (${fill}%)`:"");$("wait").disabled=!S.coll||fill>=100||pure;
  $("test").disabled=!S.lamp||fill===0||pure;$("test").classList.toggle("done",pure);
  $("st4").classList.toggle("off",!pure);$("st5").classList.toggle("off",!done4);
}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
function wsel(id){return `<select id="${id}"><option value="">?</option>${t("w").map((w,i)=>`<option value="${i+1}" ${wv[id]==i+1?"selected":""}>${w}</option>`).join("")}</select>`}
function renderTable(){$("tbl").innerHTML=t("rows").map((r,i)=>`<tr><td>${r}</td><td><select data-r="${i}">${opts(t("o")[i],tv[i])}</select></td></tr>`).join("");
  $("props").innerHTML=t("props").map((p,i)=>`<label><input type="checkbox" data-p="${i}" ${pv[i]?"checked":""}>${p}</label>`).join("");
  $("weq").innerHTML=`${wsel("w1")} + ${wsel("w2")} <span>→</span> ${wsel("w3")} + ${wsel("w4")}`}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");
  render();renderSteps();renderTable();
}
function msg(id,text,ok){const m=$(id);m.textContent=text;m.className="msg "+(ok?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;testing=null;render();renderSteps();if(k==="seal")msg("m1",t("sealed"),true)});
$("wait").onclick=()=>{testing=null;const old=fill;fill=Math.min(100,fill+50);render();const g=$("gas");if(g){const full=g.getAttribute("height");g.setAttribute("height",full*old/fill||0);requestAnimationFrame(()=>requestAnimationFrame(()=>g.setAttribute("height",full)))}renderSteps();msg("m2",t("fill").replace("{p}",fill),true)};
$("test").onclick=()=>{if(fill<100){testing="loud";sound(true);fill=0;msg("m3",t("loud"),false)}else{testing="soft";sound(false);pure=true;msg("m3",t("soft"),true)}render();renderSteps()};
$("tbl").addEventListener("change",e=>{const r=e.target.dataset.r;if(r==null)return;tv[r]=e.target.value;e.target.classList.remove("ok","bad")});
$("props").addEventListener("change",e=>{const p=e.target.dataset.p;if(p!=null)pv[p]=e.target.checked});
$("weq").addEventListener("change",e=>{if(e.target.id)wv[e.target.id]=e.target.value;e.target.classList.remove("ok","bad")});
$("chk4").onclick=()=>{let ok=true;document.querySelectorAll("#tbl select").forEach(s=>{const g=s.value==="1";s.classList.toggle("ok",g);s.classList.toggle("bad",!g);if(!g)ok=false});
  [1,0,1,0].forEach((w,i)=>{const lab=document.querySelector(`[data-p="${i}"]`).parentElement,good=!!pv[i]===!!w;lab.style.color=good?"":"var(--bad)";if(!good)ok=false});
  const v=["w1","w2","w3","w4"].map(id=>$(id).value),L=[v[0],v[1]].sort().join(),R=[v[2],v[3]].sort().join(),eq=L==="1,2"&&R==="3,4";["w1","w2","w3","w4"].forEach(id=>$(id).className=eq?"ok":"bad");if(!eq)ok=false;
  done4=ok;renderSteps();ok?msg("m4",t("ok4"),true):msg("m4",t("bad4"),false)};
$("send").onclick=()=>{const f=["a1","a2"].every(id=>$(id).value.trim());msg("m5",f?t("sent"):t("empty"),f)};
applyLang();
}
</script>
