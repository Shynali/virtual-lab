e2:"Опыт 2. Окисление метаналя гидроксидом меди (II)",e2h:"Налей в пробирку по 1 мл растворов сульфата меди (II) и гидроксида натрия. К образовавшемуся осадку добавь 1–2 мл формалина и нагрей смесь.",
bcu:"1 мл CuSO₄ + 1 мл NaOH",bform:"Добавить 1–2 мл формалина",cum:"Образовался голубой осадок Cu(OH)₂.",h2a:"Осадок сначала стал жёлтым (CuOH)…",h2b:"В конце образовался кирпично-красный осадок Cu₂O.",
e3:"Опыт 3. Взаимодействие крахмала с иодом",e3h:"Налей в пробирку 4–5 мл воды, добавь немного крахмала и встряхни. Влей суспензию в горячую воду, встряхивая. Разбавь полученный клейстер холодной водой (1:20) и разлей по 3 мл в две пробирки. В одну добавь спиртовой раствор иода, в другую — раствор иодида калия.",
bst:"Вода + крахмал, встряхнуть",bpaste:"Влить в горячую воду — клейстер",bdil:"Разбавить и разлить в две пробирки",bi2:"В 1-ю раствор иода",bki:"Во 2-ю раствор KI",stm:"Образовалась белая мутная суспензия.",pastem:"Образовался полупрозрачный густой клейстер.",i2m:"В первой пробирке появилась интенсивная синяя окраска.",kim:"Во второй пробирке синей окраски нет.",

qs:[["Почему глюкоза вступает в реакцию «серебряного зеркала»?",["—","В молекуле есть альдегидная группа –CHO","В молекуле есть карбоксильная группа","Это кетон"],"1"],["При окислении альдегидов образуются:",["—","Карбоновые кислоты","Спирты","Алканы"],"1"],["Почему при нагревании с Cu(OH)₂ сначала выпадает жёлтый, а затем красный осадок?",["—","Сначала образуется жёлтый CuOH, который разлагается до красного Cu₂O","Раствор перегревается","Формалин испаряется"],"1"],["Почему синяя окраска появилась только в первой пробирке?",["—","Синюю окраску с крахмалом даёт только свободный иод I₂, а ионы I⁻ — нет","KI разрушает крахмал","Во второй пробирке нет крахмала"],"1"],["Глюкоза — альдегидоспирт, потому что:",["—","Содержит и альдегидную, и несколько гидроксильных групп","Содержит только гидроксильные группы","Содержит только альдегидную группу"],"1"]],
check:"Проверить",ok:"Всё верно! Альдегидная группа обнаруживается реакциями «серебряного зеркала» и с Cu(OH)₂; крахмал с иодом даёт синюю окраску.",bad:"Неверных ответов: ",
eqm:"Уравнения реакций:",

send:"Отправить учителю",sent:"В демо-версии отправка пока не работает. В полной версии работа попадёт на страницу учителя.",empty:"Сначала ответь на все вопросы.",hot:"горячая вода"}};
let lang="kk",ok=false,view=1,heat=0,phase1=0,phase2=0;const S={ag:0,glu:0,h1:0,cu:0,form:0,h2:0,st:0,paste:0,dil:0,i2:0,ki:0};const qv={},ev={};
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const CLR="rgba(200,228,242,.55)";
function tube(x,lab,liq,lh,ex,wall,TOP=90,BOT=320){const W=60;let h=`<clipPath id="c${x}"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" rx="${W/2}"/><rect x="${x}" y="${TOP}" width="${W}" height="${(BOT-TOP)/2}"/></clipPath><g clip-path="url(#c${x})"><rect x="${x}" y="${TOP}" width="${W}" height="${BOT-TOP}" fill="var(--glass)"/>`;
  if(liq)h+=`<rect x="${x}" y="${BOT-lh}" width="${W}" height="${lh}" style="fill:${liq}"/>`;h+=(ex||"");
  if(wall)h+=`<defs><linearGradient id="ag${x}" x1="0" x2="1"><stop offset="0" stop-color="#6b7280"/><stop offset=".25" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#9ca3af"/><stop offset=".75" stop-color="#e5e7eb"/><stop offset="1" stop-color="#4b5563"/></linearGradient></defs><rect x="${x}" y="${BOT-lh-10}" width="${W}" height="${lh+10}" fill="url(#ag${x})" opacity="${wall}"/>`;
  h+=`</g><path d="M${x} ${TOP-8}V${BOT-W/2}a${W/2} ${W/2} 0 0 0 ${W} 0V${TOP-8}" fill="none" stroke="var(--glassline)" stroke-width="2.4"/>`;
  if(lab)h+=`<text x="${x+W/2}" y="${BOT+24}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${lab}</text>`;return h}
function flame(cx,tip){return`<path class="flame" d="M${cx} ${tip}c-15 18-17 36-10 50h20c7-14 5-32-10-50z" fill="#f97316" opacity=".9"/><path class="flame" d="M${cx} ${tip+20}c-7 11-8 20-4 30h8c4-10 3-19-4-30z" fill="#fde047"/><rect x="${cx-3}" y="${tip+48}" width="6" height="10" fill="#57534e"/><path d="M${cx-30} ${tip+100}l8-42h44l8 42z" fill="rgba(200,228,242,.6)" stroke="var(--glassline)" stroke-width="2"/>`}
function render(){let h="";
  if(view===1){const liq=S.ag?(S.glu?"rgba(226,232,240,.8)":CLR):null,lh=S.glu?90:45;h+=tube(250,S.h1&&!heat?"Ag↓":"",liq,lh,"",phase1>0?Math.min(1,phase1):0);if(heat===1)h+=flame(280,316)}
  if(view===2){let ex="",lh=S.cu?70:0,liq=S.cu?CLR:null;if(S.form)lh=95;
    const c=phase2===0?"#60a5fa":phase2===1?"#facc15":"#b91c1c";if(S.cu)ex=`<rect x="250" y="${320-lh}" width="60" height="${lh}" fill="${c}" opacity=".45"/><ellipse cx="280" cy="308" rx="24" ry="10" fill="${c}" stroke="rgba(0,0,0,.2)"/>`;
    h+=tube(250,heat===2?"":S.h2?"Cu₂O↓":S.cu?"Cu(OH)₂↓":"",liq,lh,ex);if(heat===2)h+=flame(280,316)}
  if(view===3){if(!S.dil){const liq=S.st?(S.paste?"rgba(241,245,249,.85)":"#f1f5f9"):null;h+=tube(250,S.paste?(lang==="kk"?"клейстер":"клейстер"):"",liq,S.paste?130:80,S.st&&!S.paste?`<rect x="250" y="240" width="60" height="80" fill="#fff" opacity=".7"/>`:"");
      if(S.st&&!S.paste)h+=`<text x="380" y="280" font-size="12" fill="var(--mute)">→ ${t("hot")}</text>`}
    else{h+=tube(170,"I₂",S.i2?"#1e1b4b":"rgba(241,245,249,.85)",90,"")+tube(330,"KI",S.ki?"rgba(254,249,195,.85)":"rgba(241,245,249,.85)",90,"")}}
  $("scene").innerHTML=h;["v1","v2","v3"].forEach((v,i)=>$(v).classList.toggle("on",view===i+1))}
function opts(arr,v){return arr.map((s,i)=>`<option value="${i||""}" ${String(v||"")===String(i||"")?"selected":""}>${s}</option>`).join("")}
const E=[["CH₂OH(CHOH)₄CHO + Ag₂O → CH₂OH(CHOH)₄COOH + ",["k0","2"],"Ag↓"],[["k1","1"],"CuSO₄ + ",["k2","2"],"NaOH → Cu(OH)₂↓ + Na₂SO₄"],["HCHO + ",["k3","2"],"Cu(OH)₂ → HCOOH + Cu₂O↓ + ",["k4","2"],"H₂O"]];
function renderQ(){$("qs").innerHTML=t("qs").map((q,i)=>`<label style="margin-top:6px"><span>${q[0]}</span><select data-q="${i}">${opts(q[1],qv[i])}</select></label>`).join("");
  $("eqs").innerHTML=`<small style="font-size:13px;color:var(--mute);font-weight:600">${t("eqm")}</small>`+E.map(e=>`<div class="eq">${e.map(p=>typeof p==="string"?p:`<input id="${p[0]}" data-a="${p[1]}" inputmode="numeric" value="${ev[p[0]]||""}">`).join("")}</div>`).join("")}
function renderSteps(){const g=$("goggles").checked;["st1","st2","st3"].forEach(s=>$(s).classList.toggle("off",!g));
  const DEP={glu:"ag",h1:"glu",form:"cu",h2:"form",paste:"st",dil:"paste",i2:"dil",ki:"dil"};document.querySelectorAll("[data-b]").forEach(b=>{const k=b.dataset.b,en=(!DEP[k]||S[DEP[k]])&&!heat;b.disabled=!!S[k]||!en;b.classList.toggle("done",!!S[k])});
  $("st4").classList.toggle("off",!(S.h1&&S.h2&&S.i2&&S.ki&&!heat));$("st5").classList.toggle("off",!ok)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==="string")el.textContent=v});
  $("l-kk").classList.toggle("on",lang==="kk");$("l-ru").classList.toggle("on",lang==="ru");
  document.querySelectorAll(".msg").forEach(m=>m.textContent="");render();renderQ();renderSteps()}
function msg(id,text,okk){const m=$(id);m.textContent=text;m.className="msg "+(okk?"ok":"bad")}
$("l-kk").onclick=()=>{lang="kk";applyLang()};$("l-ru").onclick=()=>{lang="ru";applyLang()};
[1,2,3].forEach(i=>$("v"+i).onclick=()=>{view=i;render()});
$("goggles").onchange=renderSteps;
document.querySelector(".grid").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b||b.disabled)return;const k=b.dataset.b;S[k]=1;
  view=["ag","glu","h1"].includes(k)?1:["cu","form","h2"].includes(k)?2:3;
  if(k==="h1"){heat=1;msg("m1",t("h1a"),true);const iv=setInterval(()=>{phase1+=0.1;render();if(phase1>=1){clearInterval(iv);heat=0;msg("m1",t("h1b"),true);render();renderSteps()}},300);render();renderSteps();return}
  if(k==="h2"){heat=2;render();renderSteps();setTimeout(()=>{phase2=1;msg("m2",t("h2a"),true);render()},1200);setTimeout(()=>{phase2=2;heat=0;msg("m2",t("h2b"),true);render();renderSteps()},3000);return}
  const M={cu:["m2","cum"],st:["m3","stm"],paste:["m3","pastem"],i2:["m3","i2m"],ki:["m3","kim"]};if(M[k])msg(M[k][0],t(M[k][1]),true);render();renderSteps()});
document.querySelector(".grid").addEventListener("change",e=>{const s=e.target;if(s.dataset.q!=null){qv[s.dataset.q]=s.value;s.className=""}});
$("eqs").addEventListener("input",e=>{const el=e.target;if(el.id)ev[el.id]=el.value;el.style.borderColor=""});
$("chk").onclick=()=>{let bad=0;document.querySelectorAll("[data-q]").forEach(s=>{const g=s.value===t("qs")[s.dataset.q][2];s.className=g?"ok":"bad";if(!g)bad++});
  document.querySelectorAll("#eqs input").forEach(el=>{const v=el.value.trim(),aa=el.dataset.a,g=v===aa||(aa==="1"&&v==="");el.style.borderColor=g?"var(--ok)":"var(--bad)";if(!g)bad++});
  ok=!bad;renderSteps();ok?msg("m4",t("ok"),true):msg("m4",t("bad")+bad+".",false)};
$("send").onclick=()=>{const f=["a1","a2","a3"].every(id=>$(id).value.trim());msg("m5",f?t("sent"):t("empty"),!!f)};
applyLang();
}
</script>
